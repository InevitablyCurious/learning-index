# ─────────────────────────────────────────────────────────────────────────────
# Bench Dashboard
#
#   cd dashboard && docker compose up -d
#   open http://localhost:8717
#
# In Docker Desktop the container appears as `learning-index-dashboard` with
# 8717 as a clickable link, and the health dot goes green once the board
# assembles.
# ─────────────────────────────────────────────────────────────────────────────

# The project name is pinned, never left to compose's folder-name default: this
# directory is called `dashboard`, and any other checkout with the same folder
# name would otherwise share the project and replace this board's container.
name: learning-index-dashboard

services:
  learning-index-dashboard:
    build: .
    image: learning-index-dashboard:v1
    container_name: learning-index-dashboard
    restart: unless-stopped

    ports:
      # FAIL-CLOSED publish contract (the process validates it at startup via
      # OKP_BIND_HOST in environment: below — a mismatch refuses to boot):
      # the container binds 0.0.0.0 internally (marker OKP_DASH_CONTAINER);
      # this publish host is the real exposure boundary.
      #   REMOTE_VIEWING=disabled (default) — OKP_BIND_HOST must be unset or
      #     loopback; a wildcard (0.0.0.0/::) or any LAN IP is REFUSED.
      #   REMOTE_VIEWING=enabled — OKP_BIND_HOST must be a SPECIFIC physical
      #     LAN address (e.g. 192.168.50.140); wildcard, loopback and unset
      #     are all REFUSED. All-interfaces is never "LAN-only".
      - "${OKP_BIND_HOST:-127.0.0.1}:8717:8717"

    volumes:
      # The bench repo, READ-ONLY. `:ro` is not decoration — the dashboard has
      # no reason to write, and the run artifacts under runs/ are the
      # authoritative record of a measurement (RC-5). A read-only mount makes
      # "the dashboard corrupted a run" structurally impossible rather than
      # merely unlikely.
      - ..:/bench:ro

    environment:
      # LAN switch: disabled (default) = loopback publish only; enabled =
      # publish on a SPECIFIC LAN IP (OKP_BIND_HOST below), gated by the
      # same-origin relay + peer policy. Any other value is rejected and the
      # dashboard refuses to start.
      REMOTE_VIEWING: "${REMOTE_VIEWING:-disabled}"
      # The publish host, passed IN so the process can validate the publish
      # contract above and refuse a mismatch at startup (fail-closed):
      # disabled + wide publish, or enabled + wildcard/loopback/unset
      # publish, both stop the boot instead of silently exposing or hiding.
      OKP_BIND_HOST: "${OKP_BIND_HOST:-127.0.0.1}"
      # Marker: the in-container 0.0.0.0 bind is internal; the compose
      # publish bind (OKP_BIND_HOST above) is the real exposure boundary.
      OKP_DASH_CONTAINER: "1"
      OKP_DASH_BENCH_ROOT: /bench
      OKP_DASH_POLL_MS: "2000"

      # The live agent session API runs on the HOST, not in this container.
      # host.docker.internal is the documented Docker Desktop path to it.
      # If unreachable, the source reports `unwired` and the board simply
      # loses liveness — it does not fail.
      OKP_DASH_OPENCODE_URL: "http://host.docker.internal:8719"

      # ── OPT-IN: host-side control plane ─────────────────────────────────
      # The control plane is the ONLY write-capable surface. This dashboard
      # performs no writes: it READS state from the control plane and RELAYS
      # the browser's same-origin writes to it.
      #
      # ONE URL: OKP_DASH_CONTROL_URL is the RELAY's upstream to the loopback
      # control plane (host.docker.internal crosses the container boundary).
      # The browser no longer needs a public control URL — it only ever talks
      # to the dashboard, which relays.
      #
      # The control plane binds 127.0.0.1 with no --host flag, by design.
      # Docker Desktop's proxy presents host.docker.internal traffic to the
      # host as loopback, so that bind is preserved, NOT weakened.
      OKP_DASH_SOURCE_CONTROL_PLANE: "1"
      # The gate suite, split out of the control-plane source so a slow or
      # absent roster cannot hold the TUI mirror. Same service, own row.
      OKP_DASH_SOURCE_GATE_SUITE: "1"
      OKP_DASH_CONTROL_URL: "http://host.docker.internal:8718"

      # ── OPT-IN: hub recall tables ───────────────────────────────────────
      # Off by default. The board must come up on a machine with no database
      # and no Okp stack. Enable by uncommenting these AND the network
      # block below, then `docker compose up -d`.
      # OKP_DASH_HUBDB: "1"
      # OKP_HUB_DB_HOST: postgres
      # OKP_HUB_DB_PORT: "5432"
      # OKP_HUB_DB_USER: okp
      # OKP_HUB_DB_NAME: okp_hub
      # OKP_HUB_DB_PASSWORD: okp_dev

    extra_hosts:
      # Makes host.docker.internal resolve on Linux too, where it is not
      # automatic as it is on Docker Desktop.
      - "host.docker.internal:host-gateway"

    # ── OPT-IN: join the hub stack network to reach postgres by name ────
    # The network is named after the compose project in hub/infra (name: okp),
    # so it is okp_default — verify with `docker network ls` before enabling.
    # networks:
    #   - okp_default

# networks:
#   okp_default:
#     external: true
