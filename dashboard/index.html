<!doctype html>
<html lang="en" data-theme="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bench Board v2</title>
<!--
─────────────────────────────────────────────────────────────────────────────
 BENCH BOARD v2 — LONGITUDINAL FRAME

 ONE QUESTION THIS BOARD ANSWERS:
   does a growing memory corpus make the SAME local model finish the SAME
   build in fewer turns, fewer tokens and less time — and at which ON run
   does that stop being true?

   IT USED TO SAY "at what corpus size". The board cannot answer that: the
   producer of the per-cell corpus delta was deleted in the recall-only pivot
   (2026-08-14) and nothing on disk carries the corpus level at recall time.
   The curve is indexed by ON RUN, which is a fact the board holds. Restoring
   a corpus axis is new instrumentation — see `sources/stack-ledger.mjs`
   ruling 2 — not a re-render.

 TWO AXES, NEVER BLENDED (hard rule):
   CORRECTNESS  gates passed / total          → GATE WALL
   EFFICIENCY   turns · tokens · wall time    → TRANSFER CURVE
 They sit adjacent, at equal weight. They are never multiplied, averaged or
 collapsed into a score. An ON run CAN be faster AND worse — the last OFF cell
 was FAIL with 25 failed gates — and a layout that makes faster-and-worse read
 as a win is a broken layout.

 CELL = 5 PHASES (1 build + 4 grades):
   1  BUILD   harness label `initial`   — internally 6 work orders (phase 1 only)
   2  GRADE   verdict-pass-1 / feedback-1
   …  GRADE   …
   5  GRADE   verdict-pass-4 / feedback-4

 JSON CONTRACT v2.0 — what this board consumes. Diff against contract.mjs and
 against what the backend actually emits.

 {
   contract_version, generated_at,
   run:        { org_id, model, arm, cell_label, started_at, elapsed_s, phase,
                 chunk{current,total}, attempt{current,max}, turns,
                 session_turns, tokens{input,output,injected_block}, state,
                 session_id, log_silent_s, terminal_status }
   stack:      { id, baseline, runs[], metrics{turns,tokens,seconds}, state }
                 baseline = the ONE OFF cell. n=1 BY DESIGN, never a
                 distribution. runs[] = ON cells in sequence order.
   provenance: { attestation, gate_mode, gate_mode_source, policy_version,
                 policy_anchor_status, worker_image_fp, leader_fp, corpus, seed }
   wall:       { gates:[{id,req,title,a,b,...}], totals:{a,b} }
   honesty:    { … the rail … }
   sources:    [{ id, ok, fields[], reason, provenance, ms }]
 }

 EVERY FIELD IS NULLABLE. null = NOT OBSERVED and renders as an explicit state.
 Three null-ish states stay visually distinct: unobserved / unwired / zero.
 A MEASURED ZERO IS NOT MISSING DATA and never renders like one.
─────────────────────────────────────────────────────────────────────────────
-->
<style>
/* ══════════════════════════════════════════════════════════════════════════
   Okp Design System — GREEN phosphor.
   Values below are lifted VERBATIM from the design source's own token file
   (`Bench Board v2.html`, unpacked). They are not approximations and
   must not be "tidied" — the board is judged against that artifact.
   ══════════════════════════════════════════════════════════════════════════ */

:root,
[data-theme="green"] {
  /* surfaces */
  --bg:        #02100a;   /* canvas — deepest screen black-green */
  --bg-2:      #04190f;   /* raised surface / panel */

  /* text */
  --fg:        #2fe07a;   /* default foreground — phosphor text */
  --dim:       #0f5e32;   /* de-emphasis: notes, axis, hints */
  --comment:   #1d7a44;
  --type:      #e2ffec;   /* brightest — titles & headline numbers */
  --cmd:       #e2ffec;

  /* signal */
  --accent:    #54f59a;
  --ok:        #b8ffcf;
  --check:     #6dff9e;
  --link:      #aaffc8;
  --link-glow: #27ff7eaa;
  --cursor:    #6dff9e;
  /* OFF-HUE #1. Reserved for: gate failure, regression, the
     and a LAN-exposed hold. Never decorative. */
  --danger:    #ff6b6b;
  /* OFF-HUE #2 — deliberate deviation: the VOID status colour on run cards. */
  --warn:      #e0b34d;

  /* ── CORRIDOR ENCODING (panels/corridor.js) ───────────────────────────────
     The track speaks in symbol + colour as a KEY, never as the claim itself:
     blue is build, red is troubleshooting, green is a compaction rule, and the
     detail layer's six facts each own one hue so a chip is read without
     reading. YELLOW IS NOT A CATEGORY — it is the selection outline and it
     appears on nothing else. Claims that used to ride on hue are drawn: failure
     is a diagonal hatch + FAIL, held is a gate, a stall is a dotted hatch. */
  --corr-build:   #4b8bff;
  --corr-trouble: #ff6b6b;
  --corr-compact: #6dff9e;
  --corr-sel:     #ffe23d;
  --corr-in:      #4bd6ff;
  --corr-out:     #ff7ad9;
  --corr-reason:  #b48cff;
  --corr-cache:   #2fd3b5;

  /* semantic aliases — product code uses THESE */
  --surface:        var(--bg);
  --surface-raised: var(--bg-2);
  --text-bright:    var(--type);
  --text-body:      var(--fg);
  --text-muted:     var(--dim);
  --border:         color-mix(in srgb, var(--fg) 14%, transparent);
  --border-strong:  color-mix(in srgb, var(--fg) 22%, transparent);
  --hairline:       color-mix(in srgb, var(--fg) 10%, transparent);
  --selection:      color-mix(in srgb, var(--accent) 38%, transparent);
  --focus-ring:     color-mix(in srgb, var(--accent) 18%, transparent);
  --glow:           color-mix(in srgb, var(--accent) 12%, transparent);

  /* typography — one typeface, hierarchy from weight/size/colour/tracking */
  --font: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* spacing / radii / elevation */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:24px; --space-6:32px; --space-7:44px;
  --radius-sm:6px; --radius-md:8px; --radius-lg:10px; --radius-xl:12px;
  --radius-pill:999px;
  --shadow-raise: 0 10px 30px rgba(0,0,0,.4);
  --shadow-term:  0 30px 80px rgba(0,0,0,.5);

  --ease: cubic-bezier(.2,.6,.2,1);
  --dur-fast:.12s; --dur-base:.15s;

  /* ── MOTION — lifted VERBATIM from the design system's tokens/motion.css ──
     "Nothing fades in. Everything is TYPED, as if a developer is at the
      keyboard right now. Cadence is human, not metronomic."

     These sixteen tokens were declared by the design system and NONE of them
     existed in this board — the README recorded the deviation as "No ambient
      animation", which was true and was the gap. They live here, in CSS, as the
      single source of truth for the board's motion cadence.

     They are not decoration. The typed cadence is the brand's signature and
     the reason motion here reads as a person at a keyboard rather than a
     progress bar. */

  /* typing cadence (per character) */
  --type-char-min: 7ms;
  --type-char-max: 18ms;
  --type-space-mult: 1.2;    /* spaces are slightly slower */
  --type-punct-mult: 1.3;    /* punctuation lingers */
  --type-think-chance: 0.02; /* 2% chance of a 40–110ms pause */

  /* global tempo knob */
  --tempo-chill: 1.7;
  --tempo-normal: 1.0;
  --tempo-fast: 0.5;

  /* the cursor — hard steps, no fade */
  --cursor-blink: 1.05s;

  /* grid trail */
  --trail-hold: 200ms;
  --trail-fade: 400ms;
  --trail-life: 600ms;       /* hold + fade */

  /* loading sweep */
  --sweep-step: 105ms;
  --sweep-cycles: 3;

  /* board geometry — measured off the design source.
     §8.1 of the artifact is a 1920px board with curve|wall at 50/50. */
  --pad: 14px;
  --gap: 14px;
  --board-max: 1920px;

  /* ── TYPE SCALE ──────────────────────────────────────────────────────────
     recall.js consumes --fs-label / --fs-ident and rail.js consumes
     --fs-metric. They were dropped in the token rewrite, so every rule
     keyed on them silently resolved to nothing and the text rendered at
     inherited size. Restored at the artifact's own measured values. */
  --fs-label:  11px;   /* kickers, axis labels, rail captions */
  --fs-ident:  12px;   /* identifiers, cids, verbatim strings */
  --fs-body:   12.5px; /* body copy inside panels */
  --fs-row:    13px;   /* ledger + feed rows */
  --fs-metric: 22px;   /* headline numbers (rail derives .8 of this) */

  /* ── SEMANTIC SIGNAL ALIASES ─────────────────────────────────────────────
     The panels were written against these names and they outlived the
     rewrite that removed them. --fail/--pass/--arm-a/--arm-b/--rule/--null
     are what recall.js, live.js and the wall actually reference. They are
     ALIASES onto the one palette above, never a second palette: --fail is
     --danger, the only off-hue on the board. */
  --fail:  var(--danger);
  --pass:  var(--fg);
  --arm-a: var(--fg);      /* MEMORY ON */
  --arm-b: var(--dim);     /* CONTROL   */
  --rule:  var(--hairline);
  --null:  var(--dim);
  --panel: var(--bg-2);
}

/* ── VIEWPORT STEP-DOWN ──────────────────────────────────────────────────
   1920+ is the primary target. The board must ALSO survive 1440×900,
   1366×768 and 1280×800 — measured breakpoints, not guesses. The ledger's
   fixed track list is the thing that overflows first, so the narrow steps
   shrink the identity columns (model, corpus) rather than the numbers, and
   the rail reflows from 6 fixed columns to auto-fit. Nothing is hidden. */
:root { --ledger-cols: 52px 62px 210px 128px 78px 96px 84px 96px 104px 104px 1fr; }
@media (max-width:1600px){
  :root { --ledger-cols: 46px 56px 150px 116px 70px 84px 78px 90px 88px 96px 1fr; --pad:12px; --gap:12px; }
}
@media (max-width:1400px){
  :root { --ledger-cols: 42px 50px 118px 104px 62px 76px 72px 84px 78px 88px 1fr; }
}

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--font); font-size:13px;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}
::selection{background:var(--selection);color:var(--type)}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--type)}

/* The board is a VERTICAL DOCUMENT, not a fixed viewport grid.
   v1 pinned everything to 100vh with overflow:hidden, which silently
   AMPUTATED panel tails on a laptop — content clipped without a mark is
   indistinguishable from content that was never rendered, the exact
   dishonesty the null-state rules exist to stop. Eight surfaces do not fit
   in 800px of height honestly, so the page scrolls and the chrome sticks. */
#root{
  display:flex; flex-direction:column; gap:var(--gap);
  padding:var(--pad);
  padding-bottom:64px;
  min-height:100vh;
  width:min(100vw, var(--board-max));
}
.shell{max-width:var(--board-max);margin:0 auto;display:flex;flex-direction:column;gap:var(--gap);width:100%;min-width:0}

/* NO AMBIENT ANIMATION. The board is on screen for hours. Motion is reserved
   for STATE CHANGES that announce themselves once and settle — never a loop
   that runs while nothing is happening. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important}
}

/* ── shared atoms ───────────────────────────────────────────────────────── */

.ttl{font:700 11px var(--font);letter-spacing:.18em;color:var(--type)}
.sub{font:400 12px var(--font);color:var(--dim)}
.kick{font:700 10.5px var(--font);letter-spacing:.16em;color:var(--dim)}
.note{font:400 12px/1.6 var(--font);color:var(--dim)}
.bright{color:var(--type)}
.danger{color:var(--danger)}
.muted{color:var(--dim)}

/* THE null renderer. Three kinds of nothing stay visually distinct:
   unobserved (not measured yet) · unwired (source absent) · zero (measured). */
.null{color:var(--dim);font-style:normal}

.panel{
  background:var(--bg-2); border:1px solid var(--border);
  border-radius:var(--radius-xl); padding:var(--pad);
  display:flex; flex-direction:column; gap:12px; min-width:0;
}
.phead{display:flex;align-items:baseline;gap:12px;min-width:0}
.phead .sub{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tag{
  font:700 11px var(--font);letter-spacing:.14em;
  color:var(--dim);border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);padding:4px 8px;white-space:nowrap;
}
.tag.on{color:var(--type)}
.tag.bad{color:var(--danger);border-color:var(--danger)}
/* AMBER IS OPERATOR CAUTION, never failure — the off-hue is reserved for gate
   failure, regression and a LAN-exposed hold. `ATTEMPT n · IN FLIGHT` and
   `RUN UNSTATED` are both "this reading is not final / not sourced", which is
   the same category as dev mode being on. */
.tag.warn{color:var(--warn,#e0b34d);border-color:var(--warn,#e0b34d)}
/* A quiet provenance chip. It must be READABLE and must not compete with the
   headline it sits beside — this is the run these squares came from, which is
   checked occasionally and glanced past the rest of the time. */
.tag.dim{color:var(--dim);border-color:var(--hairline);font-weight:400;letter-spacing:.06em}

/* ── WO-CHUNKVIS-1: the build strip ──────────────────────────────────────
   Which of the five build chunks landed. Display only; nothing gates on it.

   NO OFF-HUE HERE, DELIBERATELY. `--danger` is reserved for gate failure,
   regression and a LAN-exposed hold. A chunk
   that died is none of those — it is a build fact, not a verdict — so the
   states separate by WEIGHT and RULE instead, which also keeps them legible
   in greyscale the way every other rule-based mark on this board is. */
.bc-strip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:5px}
.bc-kick{font:700 10px var(--font);letter-spacing:.16em;color:var(--dim)}
.bc{font:400 11.5px var(--font);letter-spacing:.04em;white-space:nowrap;color:var(--dim)}
.bc.complete{color:var(--check)}
/* The one that broke: full weight plus a rule under it, so it is findable at a
   glance in a column of otherwise dim ticks. */
.bc.died{color:var(--fg);font-weight:700;border-bottom:2px solid var(--fg);padding-bottom:1px}
.bc.not_reached{color:var(--dim)}
/* The claim contradicted by the file it owns. Words carry this, not colour. */
.bc-warn{
  font:400 11px/1.5 var(--font);color:var(--fg);
  border-left:2px solid var(--fg);padding-left:7px;margin-top:4px;
}

/* segmented control — the curve's metric + scope switches */
.seg{display:flex;border:1px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden;flex:none}
.seg button{
  font:400 11px var(--font);letter-spacing:.12em;
  padding:5px 11px;background:transparent;color:var(--fg);
  border:0;border-left:1px solid var(--border-strong);cursor:pointer;
}
.seg button:first-child{border-left:0}
.seg button.on{font-weight:700;background:var(--fg);color:var(--bg)}
.seg button:hover:not(.on){color:var(--type)}

.btn{
  font:700 12px var(--font);letter-spacing:.12em;
  background:transparent;color:var(--fg);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  padding:8px 14px;cursor:pointer;
}
.btn:hover:not(:disabled){color:var(--type);border-color:var(--fg)}
.btn:disabled{color:var(--dim);border-color:var(--hairline);cursor:not-allowed}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* ── BUTTON POLISH ────────────────────────────────────────────────────────
   Three defects, all of them things you feel rather than see:

   1. THE ROW JUMPED. A label that changes width on click ("run" ->
      "running…") reflowed the row under the cursor. `min-width` on the action
      button holds the box while the word changes, so the only thing that moves
      is the text.
   2. NO KEYBOARD RING. `:focus-visible` was never styled, so tabbing through
      the drawer was invisible. It only shows for keyboard focus, so mouse users
      see no change.
   3. NOTHING ACKNOWLEDGED THE PRESS. A button that looks identical the instant
      you click it reads as broken on a slow action. `:active` drops it 1px —
      the smallest honest "I got that".

   Deliberately NOT added: a spinner. The busy state already says "running…" in
   the button's own words, and a spinner that keeps turning after a command has
   silently died is a worse lie than a word that just sits there. */
.btn:focus-visible{outline:2px solid var(--check);outline-offset:2px}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.sm{min-width:74px;text-align:center}
.btn[data-tool-run]{min-width:92px}
.btn.primary:hover:not(:disabled){background:var(--check);border-color:var(--check);color:var(--bg)}
.btn.primary:disabled{background:var(--bg-2);color:var(--dim);border-color:var(--hairline)}
@media (prefers-reduced-motion:reduce){.btn:active:not(:disabled){transform:none}}
.btn.primary:hover:not(:disabled){background:var(--check);border-color:var(--check);color:var(--bg)}
.btn.destroy{color:var(--danger);border-color:var(--danger)}
.btn.destroy:hover:not(:disabled){background:var(--danger);color:var(--bg)}
.btn.sm{font-size:11px;padding:3px 8px}
/* THE SELECTED SOURCE. Marks the ONE baseline row whose record the DATA FEED
   card is showing, so "which record am I reading" is answerable from the list
   as well as from the card. Filled rather than outlined — it is a state, not an
   offer, and it is the control that returns the card to the live cell. */
.btn.picked{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.picked:hover:not(:disabled){background:var(--type);border-color:var(--type);color:var(--bg)}

.sel{
  font:400 12px var(--font);
  background:var(--bg);color:var(--type);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  padding:6px 8px;width:100%;
}
.sel:disabled{color:var(--dim);opacity:.6;cursor:not-allowed}

/* ── topbar ─────────────────────────────────────────────────────────────── */
/* NOWRAP IS LOAD-BEARING: these are single-line identity chips. Wrapping them
   grows the bar and cascades height into every row below. The long, repeated
   identifiers (model, campaign) are the only things allowed to ellipsize. */
.topbar{
  display:flex;align-items:center;gap:16px;
  padding:0 4px 12px;border-bottom:1px solid var(--hairline);
  flex-wrap:nowrap;white-space:nowrap;
  position:sticky;top:0;z-index:30;background:var(--bg);
  padding-top:2px;
}
.topbar>*{flex:0 0 auto}
.vr{width:1px;height:18px;background:var(--border-strong)}

/* ── RUN PULSE ───────────────────────────────────────────────────────────────
   MOTION MEANS WORK IS HAPPENING, and it means nothing else. Only .running and
   .grading animate; every terminal state is a static disc, because a spinner
   over a finished cell is the board telling a lie an operator will act on.
   Honoured for prefers-reduced-motion by swapping the sweep for a pulse in
   opacity — still "alive", no rotation. */
.pulse{
  width:11px;height:11px;border-radius:50%;flex:0 0 auto;
  border:2px solid currentColor;
  border-top-color:transparent;border-right-color:transparent;
  animation:pulse-spin .9s linear infinite;
}
.pulse-running{color:var(--accent)}
.pulse-grading{color:var(--ok)}
/* Terminal: a filled disc, no border trick, no animation. */
.pulse-failure,.pulse-stopped{
  border:none;animation:none;background:currentColor;
  width:9px;height:9px;
}
.pulse-failure{color:var(--danger)}
.pulse-stopped{color:var(--dim)}
@keyframes pulse-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .pulse-running,.pulse-grading{
    animation:pulse-fade 1.4s ease-in-out infinite;
    border-top-color:currentColor;border-right-color:currentColor;
  }
  @keyframes pulse-fade{0%,100%{opacity:1}50%{opacity:.35}}
}

/* ── STOP, IN THE BAR ────────────────────────────────────────────────────────
   Danger-hued at rest because it is destructive at rest — this button never
   becomes safe. The armed state is a second, wider click so the confirm is a
   different motion than the arm, not a double-tap of the same spot. */
.tb-stop{
  font:700 10.5px var(--font);letter-spacing:.16em;
  color:var(--danger);background:none;
  border:1px solid var(--danger);border-radius:var(--radius-sm);
  padding:5px 11px;cursor:pointer;
}
.tb-stop:hover:not(:disabled){background:color-mix(in srgb,var(--danger) 14%,transparent)}
.tb-stop:disabled{color:var(--dim);border-color:var(--hairline);cursor:not-allowed}
.tb-stop.armed{background:var(--danger);color:var(--bg)}
.tb-stopwrap{display:inline-flex;align-items:center;gap:8px;min-width:0}
.tb-keep{
  font:400 12px var(--font);color:var(--dim);
  background:none;border:1px solid var(--hairline);
  border-radius:var(--radius-sm);padding:5px 9px;cursor:pointer;
}
.tb-keep:hover:not(:disabled){color:var(--type);border-color:var(--fg)}
/* The server's restatement. Allowed to ellipsize — it is long by design, and
   the full text is never the thing being clicked. */
.tb-restate{
  font:400 11.5px var(--font);color:var(--dim);
  flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  max-width:46ch;
}

/* ── LAUNCH CHECKLIST (BASELINE · 4) ─────────────────────────────────────────
   The glyph carries the state and colour only reinforces it, so the list reads
   in greyscale and without colour vision. `unobserved` is deliberately NOT
   green: a row nobody measured must never look like a row that passed. */
.ck-head{display:block;font:700 11px var(--font);letter-spacing:.16em;color:var(--dim);margin:0 0 12px}
.ck-head.ok{color:var(--accent)}
.ck-head.bad{color:var(--danger)}
.ck-list{display:flex;flex-direction:column;gap:2px}
.ck-row{
  display:grid;grid-template-columns:16px minmax(140px,auto) 1fr;
  align-items:baseline;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--hairline);
}
.ck-row:last-child{border-bottom:none}
.ck-g{display:inline-flex;align-items:center;justify-content:center;width:12px;height:12px;font:700 12px var(--font)}
.ck-pass{color:var(--accent)}
.ck-fail{color:var(--danger)}
.ck-pending{color:var(--dim)}
.ck-unobs{color:var(--dim)}
/* The only moving thing on the card, and only while a row is actually working. */
.ck-spin{
  width:10px;height:10px;border-radius:50%;
  border:2px solid var(--accent);border-top-color:transparent;border-right-color:transparent;
  animation:pulse-spin .9s linear infinite;
}
@media (prefers-reduced-motion:reduce){
  .ck-spin{animation:pulse-fade 1.4s ease-in-out infinite;border-top-color:currentColor;border-right-color:currentColor}
}
.ck-label{font:400 13px var(--font);color:var(--type)}
.ck-row.ck-pending .ck-label{color:var(--dim)}
.ck-row.ck-running .ck-label{color:var(--type)}
.ck-row.ck-unobserved .ck-label{color:var(--dim)}
.ck-row.ck-pass .ck-label{color:var(--type)}
.ck-src{font:400 11px var(--font);color:var(--dim);white-space:nowrap}
.ck-detail{grid-column:2 / -1;font:400 11.5px/1.5 var(--font);color:var(--dim);word-break:break-word}
.ck-row.ck-fail .ck-detail{color:var(--danger)}

/* ── THE WAY OUT OF A PREFLIGHT REFUSAL ──────────────────────────────────────
   Under the checklist, not beside it: the rows say what is wrong and this says
   what to press. Bordered rather than tinted, because a red-on-red call to
   action inside an already-red refusal reads as another error rather than as
   the thing to do next. */

.cclose{font:400 11px var(--font);color:var(--dim);background:none;border:none;cursor:pointer;padding:2px 4px}
.cclose:hover{color:var(--fg)}

/* THE COMPACTION TOGGLE — under `esc`, the card's one compaction control. A
   single button showing the current state; clicking flips it. "COMPACT: ON"
   → "COMPACT: OFF" in one click, nothing else.

   RED WHEN OFF OVERRIDES A DEFAULT-ON PRECONDITION. `--danger` is deliberately
   reserved board-wide, but this is the one case the card should refuse to look
   neutral about: the model's own context window asked for on, and the operator
   has actively removed it. The red border and the red summary warning render
   together, so the colour means the same thing in both places. */
.chead-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ccompact-btn{font:400 11px var(--font);color:var(--fg);background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:5px 9px;cursor:pointer}
.ccompact-btn:hover{border-color:var(--border-strong)}
.ccompact-btn.override{border:1px solid var(--danger);color:var(--danger)}
.ctitle{font:700 14px/1.35 var(--font);color:var(--type)}
.cbody{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.cnote{font:400 11.5px/1.5 var(--font);color:var(--dim)}
.cframe.final{border-top:2px solid var(--check)}

/* ONE SELECTABLE LINE, and the four states are distinguished by BORDER STYLE
   as well as colour, so the flow is usable in greyscale and by a viewer with
   colour vision deficiency — the same rule the arm vocabulary follows. */
.cline{display:flex;align-items:baseline;gap:9px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;min-width:0}
.cline.off{cursor:pointer}
.cline.off:hover{border-color:var(--border-strong);background:color-mix(in srgb, var(--fg) 4%, transparent)}
.cline.on{border-color:var(--check);background:var(--bg-2);cursor:pointer}
/* DEAD IS DIM AND UNHOVERABLE — it must not read as a control awaiting a click.
   Its `meta` line carries the refusal, which is why the line is kept at all
   rather than being hidden: the reason is the thing the operator needs. */
.cline.dead{border-color:var(--hairline);color:var(--dim);cursor:not-allowed}
.cline.ghost{border-style:dashed;border-color:var(--border)}
.cglyph{flex:none;font:400 11.5px var(--font);color:var(--dim);width:12px}
.cline.on .cglyph{color:var(--check)}
.cline.dead .cglyph{color:var(--hairline)}
.ctext{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.ct{font:400 12.5px/1.35 var(--font);color:var(--fg);overflow-wrap:anywhere}
.cline.dead .ct{color:var(--dim)}
.cm{font:400 10.5px/1.4 var(--font);color:var(--dim);overflow-wrap:anywhere}

/* THE MODEL LIST SCROLLS, THE FRAME DOES NOT. A dialog whose own height tracks
   its longest list makes the footer controls move between steps. */
.clist{display:flex;flex-direction:column;gap:5px;max-height:230px;overflow-y:auto;overscroll-behavior:contain;min-width:0}
.cfilters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.csearch,.cprov{font:400 12px var(--font);color:var(--fg);background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:6px 9px}
.csearch{flex:1;min-width:140px}
.cshown{font:400 10.5px var(--font);color:var(--dim);white-space:nowrap}

/* THE KEY REPORT. Bordered like a statement, never like a field — there is no
   input here and the block exists partly to make that obvious. */
.ckey{display:flex;flex-direction:column;gap:3px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:8px 10px;margin-top:4px}
.ckey.on{border-color:var(--check)}
.ckey.bad{border-color:var(--danger)}
.ckey-head{font:700 10px var(--font);letter-spacing:.14em;color:var(--fg)}
.ckey.bad .ckey-head{color:var(--danger)}
.ckey-body{font:400 11.5px/1.45 var(--font);color:var(--fg);overflow-wrap:anywhere}
.ckey-note{font:400 10.5px/1.45 var(--font);color:var(--dim)}

/* THE FOOTER. BACK left, CTA right, and the CTA is the only filled control on
   the frame — dismissing or retreating costs nothing, so neither may compete
   visually with the choice that spends hours or freezes a file forever. */
.cfoot{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--hairline)}
.cback{font:400 11px var(--font);color:var(--dim);background:none;border:none;cursor:pointer;padding:4px 2px}
.cback:hover{color:var(--fg)}
.cta{font:700 10.5px var(--font);letter-spacing:.12em;color:var(--bg);background:var(--fg);border:1px solid var(--fg);border-radius:var(--radius-sm);padding:7px 12px;cursor:pointer}
.cta.final{background:var(--check);border-color:var(--check);box-shadow:0 0 18px var(--glow)}
/* DISABLED IS UNFILLED AND DASHED — it must not read as a button awaiting a
   click, and the frame's own note says what it is waiting for. */
.cta:disabled{background:transparent;color:var(--dim);border:1px dashed var(--border-strong);box-shadow:none;cursor:not-allowed}

/* ── RUN CONTROL, RAISED ON ITS OWN ────────────────────────────────────────
   The run control used to render ONLY inside the deleted profile inspector, so
   the CONFIRM button and every refusal were unreachable unless a profile existed —
   which is why [+ baseline] armed a run that could never be confirmed. It now
   has its own dialog, raised only while there is something to confirm or a
   refusal to read. Narrow, because it is one decision. */
.rmodal{width:min(640px,calc(100vw - 48px))}

/* A CLOUD CELL IS BILLED, AND THE CONTROL THAT STARTS IT SAYS SO. Ruled top and
   bottom so it survives greyscale — this is the one fact on
   the run control that costs money if it goes unread, and it is not the same
   class of thing as a refusal, so it is not drawn in the failure hue. */

/* ── EVENT-KIND FILTER CHIPS (panels/live.js) ──────────────────────────────
   These are <button>s, and `.chip` alone sets only font and colour — so they
   inherited the UA's white background with green text, and the on/off state
   that the whole control exists to express had NO definition at all: an
   operator could not tell an included kind from an excluded one.

   OFF IS DRAWN AS ABSENCE, NOT AS A DIFFERENT COLOUR. A muted, hollow chip
   reads as "these rows are not in the feed"; a second hue would read as a
   second category of event, which is exactly the confusion to avoid. */
.chip.on,.chip.off,.chip.fchip,.chip.fclear{
  font:700 11px var(--font);letter-spacing:.10em;
  background:transparent;border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);padding:3px 9px;cursor:pointer;
}
.chip.on{color:var(--fg);border-color:var(--fg)}
.chip.on:hover{color:var(--type);border-color:var(--type)}
.chip.off{color:var(--dim);border-color:var(--hairline)}
.chip.off:hover{color:var(--fg);border-color:var(--border-strong)}

/* ── FACET CHIPS: THREE STATES, BECAUSE TWO CANNOT SAY "NO FILTER" ─────────
   on/off could not express the resting state — with every chip lit, "nothing
   is filtered" and "everything is explicitly included" looked identical, and an
   operator could not tell whether a filter was engaged at all.

   neutral  nothing selected anywhere: no filter is engaged. Legible, but
            unemphasised — nothing has been chosen, so nothing is highlighted.
   picked   selected. The ONLY filled treatment on the row, so the eye finds
            what is engaged without reading the labels.
   muted    something else is picked, so this is excluded. Absence drawn as
            absence — hollow and dim, never a second hue, which would read as a
            second CATEGORY of event rather than as an exclusion. */
.chip.fchip.neutral{color:var(--fg);border-color:var(--border-strong)}
.chip.fchip.neutral:hover{color:var(--type);border-color:var(--type)}
.chip.fchip.picked{color:var(--bg);background:var(--fg);border-color:var(--fg)}
.chip.fchip.picked:hover{background:var(--type);border-color:var(--type)}
.chip.fchip.muted{color:var(--dim);border-color:var(--hairline)}
.chip.fchip.muted:hover{color:var(--fg);border-color:var(--border-strong)}
/* Appears ONLY while a filter is engaged, so its presence is itself the signal
   that the feed is narrowed. */
.chip.fclear{color:var(--dim);border-color:var(--hairline);letter-spacing:.14em}
/* THE TAB IS NOT A FILTER, so it does not borrow the filter grammar's `muted`.
   An unselected tab is a place you can go, not a value you have excluded. */
.chip.ftab{
  font:700 11px var(--font);letter-spacing:.10em;background:transparent;
  border:0;border-bottom:2px solid transparent;border-radius:0;
  padding:3px 6px;cursor:pointer;color:var(--dim);
}
.chip.ftab.picked{color:var(--fg);border-bottom-color:var(--fg)}
.chip.ftab:hover{color:var(--type)}
.ftabs{display:inline-flex;gap:2px;margin-right:6px}
/* Separates the two AXES of the backend feed's filter row — source on the left,
   severity on the right. Without it they read as one undifferentiated strip and
   the two-axis model is invisible. */
.fsep{display:inline-block;width:1px;height:14px;background:var(--hairline);margin:0 6px;vertical-align:middle}
/* Severity on the row itself, so a scan down the feed finds trouble without
   reading. A left rule only — never a fill, which at this row height would
   dominate the card. */
.evrow[data-level="warn"]{box-shadow:inset 2px 0 0 var(--type)}
.evrow[data-level="error"]{box-shadow:inset 2px 0 0 var(--danger)}
.evrow .evname{color:var(--fg);font-weight:600}
/* ── BACKEND-FEED ROWS ──────────────────────────────────────────────────────
   The event feed's second column is 22px because it holds ONE glyph. A backend
   row holds a SOURCE NAME there — `harness`, `sequencer`, or a backend's whole
   namespace — so it overran the column and printed on top of the event name.
   Only the grid changes; every other row behaviour is inherited.

   The source is DIM and LEFT-ALIGNED: it is a label saying who spoke, not a
   mark. Centring it and giving it the mark's weight made it compete with the
   event name for the eye, when the event is what the reader is scanning for. */
.evrow.bkrow{grid-template-columns:74px 82px auto minmax(0,1fr)}
.bkrow .evmark{text-align:left;font-weight:400;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.fclear:hover{color:var(--danger);border-color:var(--danger)}
/* A NON-ZERO ERROR COUNT OUTRANKS THE FILTER STATE. Errors are the one kind an
   operator must not be able to overlook, so the count carries the danger hue
   even while the chip is toggled on. It stays a border+text treatment — never a
   filled block — so it cannot be mistaken for a pressed state. */
.chip.err{color:var(--danger);border-color:var(--danger)}
.chip.err:hover{color:var(--danger);border-color:var(--danger)}

/* ── RUN CONTROL ───────────────────────────────────────────────────────────
   Design 5b. Four states: idle · blocked (with the reason ON the control) ·
   live (confirm, naming what is abandoned) · starting (bounded counter). */

.rrow{display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;align-items:center}
/* A pinned subject is a STATEMENT, not a disabled select. It is drawn as text
   with its reason attached, so it never reads as a control awaiting unlock. */

.rrow label{font:700 10.5px var(--font);letter-spacing:.16em;color:var(--dim)}
/* A narrow-context advisory on a cloud model. It is a caveat, not a refusal:
   the model is offered and armable, and this states what the operator is
   accepting. Warm rather than red for that reason. */

/* The server's own words, verbatim. Pre-wrapped because the restatement is
   composed as lines and its line breaks carry meaning. */

/* BLOCKED IS DASHED AND UNFILLED — it must not read as a button awaiting a
   click. The reason rides the label itself, never a tooltip: nobody watching a
   stream can hover, and a control disabled without saying why is
   indistinguishable from one that is broken. */

/* RESET TREE — the armed confirm sits INLINE in the top bar, not in a modal.
   A destructive-looking control that opens a dialog invites a reflex dismissal;
   this one keeps the server's restatement on screen next to the button that
   acts on it, so the words and the click cannot drift apart. */
/* RESET — the one destructive control on the board, so it is the one red button.
   It sits in the BASELINES header beside [+ BASELINE]: that row is where an
   operator changes what the bench holds, and pairing "add" with "clear" there
   beats hiding the clear in the top bar. */
.btn.blreset{color:var(--danger);border-color:var(--danger)}
.btn.blreset:hover:not(:disabled){background:var(--danger);color:var(--bg);border-color:var(--danger)}
.btn.blreset:disabled{color:var(--dim);border-color:var(--hairline);background:transparent}

/* The confirmation dialog. NARROWER than .cmodal — this is one question, and a
   920px dialog for a yes/no reads as a form to be filled rather than a decision
   to be made. */
.rmodal{width:min(560px,calc(100vw - 48px));gap:10px}
.rmodal .rm-head{font:700 11px var(--font);letter-spacing:.16em;color:var(--danger)}
.rmodal .rm-q{font:700 16px/1.35 var(--font);color:var(--type)}
.rmodal .rm-sub{font:400 12px var(--font);color:var(--dim)}
/* The server's OWN list of what moves, verbatim. pre-wrap + anywhere so the
   longest path wraps instead of clipping the sentence being agreed to. */
.rmodal .rm-list{font:400 10.5px/1.6 var(--font-mono,var(--font));white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:10px 12px;border-radius:var(--radius-sm);background:var(--panel,rgba(0,0,0,.25));border:1px solid var(--border-strong);color:var(--dim);max-height:38vh;overflow-y:auto}
.rmodal .rm-refusal{font:400 11.5px/1.6 var(--font);padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--danger);color:var(--type)}
.rmodal .rm-code{display:block;font:700 10px var(--font);letter-spacing:.14em;color:var(--danger);margin-bottom:4px}
.rmodal .rm-wait{font:400 11.5px var(--font);color:var(--dim);padding:10px 0}
.rmodal .rm-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}

/* RESTORE — the history list. Sits left of [+ BASELINE] so the row reads
   undo · add · clear. Amber rather than red: it recovers data, it never clears
   any, and colouring it like the destructive control would misstate that. */
.btn.blrestore{color:var(--warn,#e0b34d);border-color:var(--warn,#e0b34d)}
.btn.blrestore:hover:not(:disabled){background:var(--warn,#e0b34d);color:var(--bg);border-color:var(--warn,#e0b34d)}
.btn.blrestore:disabled{color:var(--dim);border-color:var(--hairline);background:transparent}

/* FIXED HEIGHT, SCROLLING INSIDE. The list is the only part that grows, so the
   header and the footer stay put however many backups there are — a dialog whose
   close button walks off the bottom of the screen is a trap. */
.kmodal{width:min(680px,calc(100vw - 48px));height:min(78vh,720px);gap:0}
.kmodal .bk-head{display:flex;flex-direction:column;gap:3px;padding-bottom:12px;border-bottom:1px solid var(--hairline)}
.kmodal .bk-title{font:700 11px var(--font);letter-spacing:.16em;color:var(--warn,#e0b34d)}
.kmodal .bk-sub{font:400 11px/1.5 var(--font);color:var(--dim)}
.kmodal .bk-list{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:12px 2px 12px 0;margin-right:-6px}
.kmodal .bk-foot{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding-top:12px;border-top:1px solid var(--hairline)}
.kmodal .bk-count{font:400 10.5px var(--font);color:var(--dim);margin-right:auto}

/* ONE CARD, FOUR ROWS: when · what model · how much · which id + the action.
   Ordered by what an operator scans for, not by what is cheapest to render. */
.bk-card{display:flex;flex-direction:column;gap:6px;padding:11px 13px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--panel,rgba(0,0,0,.22))}
.bk-card.dead{opacity:.62;border-color:var(--hairline)}
.bk-card .bk-row1{display:flex;align-items:baseline;gap:9px}
.bk-card .bk-when{font:700 12.5px var(--font);color:var(--type)}
.bk-card .bk-ago{font:400 10.5px var(--font);color:var(--dim)}
.bk-card .bk-badge{margin-left:auto;font:700 9px var(--font);letter-spacing:.12em;padding:3px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.bk-card .bk-badge.ok{color:var(--check)}
.bk-card .bk-badge.warn{color:var(--warn,#e0b34d)}
.bk-card .bk-badge.bad{color:var(--danger)}
.bk-card .bk-row2{display:flex;flex-wrap:wrap;gap:5px}
.bk-model{font:400 10.5px var(--font-mono,var(--font));padding:2px 7px;border-radius:var(--radius-sm);background:var(--surface-raised,rgba(255,255,255,.04));border:1px solid var(--hairline);color:var(--type)}
.bk-model.bk-unknown{color:var(--dim);font-style:italic}
.bk-card .bk-row3{display:flex;flex-wrap:wrap;gap:10px;font:400 10.5px var(--font);color:var(--dim)}
.bk-counts,.bk-cells{color:var(--dim)}
.bk-card .bk-why{font:400 10.5px/1.5 var(--font);color:var(--danger)}
.bk-card .bk-row4{display:flex;align-items:center;gap:8px}
.bk-card .bk-id{font:400 10px var(--font-mono,var(--font));color:var(--dim);margin-right:auto}

.kmodal .bk-confirm{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:14px 0}
.kmodal .bk-q{font:700 16px/1.35 var(--font);color:var(--type)}
.kmodal .bk-chosen{font:400 11.5px var(--font);color:var(--dim)}
.kmodal .bk-restatement{font:400 10.5px/1.6 var(--font-mono,var(--font));white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:10px 12px;border-radius:var(--radius-sm);background:var(--panel,rgba(0,0,0,.25));border:1px solid var(--border-strong);color:var(--dim)}
.kmodal .bk-refusal{font:400 11.5px/1.6 var(--font);padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--danger);color:var(--type)}
.kmodal .bk-code{display:block;font:700 10px var(--font);letter-spacing:.14em;color:var(--danger);margin-bottom:4px}
.kmodal .bk-empty{flex:1 1 auto;display:flex;align-items:center;justify-content:center;text-align:center;font:400 11.5px/1.6 var(--font);color:var(--dim);padding:24px}

/* Full-page nav to /history — the topbar's first <a>. Styled as the muted
   .tb-keep chip so it reads as a peer of the hamburger it sits left of. */
.histnav{display:inline-flex;align-items:center;font:400 12px var(--font);color:var(--dim);text-decoration:none;background:none;border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:5px 9px}
.histnav:hover{color:var(--type);border-color:var(--fg)}

/* ── THE HAMBURGER AND THE CUSTOM TOOLS DRAWER ────────────────────────────
   Three bars, drawn rather than imported: the board ships with NO network
   dependency (see the Dockerfile note on vendor/), and an icon font or an SVG
   sprite would be the first thing to break that for the sake of one glyph. */
.hamburger{display:inline-flex;flex-direction:column;justify-content:center;gap:3.5px;width:30px;height:24px;padding:0 5px;margin-left:10px;background:transparent;border:1px solid var(--hairline);border-radius:var(--radius-sm);cursor:pointer;flex:0 0 auto;position:relative}
.hamburger span{display:block;height:1.5px;background:var(--fg);border-radius:1px;transition:background .15s ease}
.hamburger:hover{border-color:var(--fg)}
.hamburger:hover span{background:var(--check)}
/* A refresh job in flight, visible with the drawer closed. The dot is steady
   (the drawer's clock is the live signal); the breathe is only a beacon. */
.hamburger .hb-act{position:absolute;top:-4px;right:-4px;width:8px;height:8px;padding:0;border-radius:50%;background:var(--accent);animation:hb-breathe 1.6s ease-in-out infinite}
@keyframes hb-breathe{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.hamburger .hb-act{animation:none}}

/* The scrim fades; the panel slides. Both are keyed off the same `.out` class
   so open and close are symmetric — a slide in followed by a pop out reads as a
   glitch rather than a transition. */
.drawer-scrim{position:fixed;inset:0;background:rgba(2,16,10,.62);backdrop-filter:blur(3px);z-index:120;animation:dw-fade .18s ease}
.drawer-scrim.out{animation:dw-fade .18s ease reverse forwards}
@keyframes dw-fade{from{opacity:0}to{opacity:1}}

/* RIGHT TO LEFT. Full height, fixed width, and the body is the only part that
   scrolls so the header and its close control never leave the screen.

   THE PANEL IS A SIBLING OF THE SCRIM, NOT A CHILD. An ancestor `backdrop-filter`
   blurs every descendant painted beneath it, so a panel nested inside the scrim
   slid in behind a blur and was invisible — the very bug this structure fixes.
   The panel sits OUTSIDE the blur (z-index 121 > scrim's 120) and the scrim
   exists only to dim and blur what is behind it. */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,calc(100vw - 32px));display:flex;flex-direction:column;background:var(--surface-raised);border-left:1px solid var(--border-strong);box-shadow:-24px 0 60px rgba(0,0,0,.45);z-index:121;animation:dw-slide .22s cubic-bezier(.22,.61,.36,1)}
.drawer.out{animation:dw-slide .18s ease reverse forwards}
@keyframes dw-slide{from{transform:translateX(100%)}to{transform:translateX(0)}}

.drawer .dw-head{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 13px;border-bottom:1px solid var(--hairline)}
.drawer .dw-titles{display:flex;flex-direction:column;gap:3px;min-width:0}
.drawer .dw-title{font:700 11px var(--font);letter-spacing:.16em;color:var(--check)}
.drawer .dw-sub{font:400 10.5px/1.5 var(--font);color:var(--dim)}
.drawer .dw-x{margin-left:auto;background:transparent;border:0;color:var(--dim);font:400 14px var(--font);cursor:pointer;padding:0 2px;line-height:1}
.drawer .dw-x:hover{color:var(--type)}

.drawer .dw-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:14px}
.drawer .dw-lede{margin:0;font:400 11px/1.65 var(--font);color:var(--dim)}
.drawer .dw-list{display:flex;flex-direction:column;gap:10px}

/* ── SWITCHES (panels/switches.js) — the MODES block at the top of the drawer ─
   A switch says "this is how things are"; a button says "do this". These two
   controls are STATES, so the position carries the value and the label does not
   have to spell it out. They sit ABOVE credentials and tools because a mode
   changes what everything below it does.

   The knob transition is the one animation here and it is short: a switch that
   eases slowly reads as laggy on a board people click fast. `prefers-reduced-
   motion` drops it entirely. */
.sw-row{display:flex;align-items:flex-start;gap:14px;padding:9px 0}
/* MACHINE SHARE — a segmented choice, not a switch: the options are the whole
   range, so showing them all is honest about what the setting can be. */
.gt-opts{display:flex;gap:4px;flex:0 0 auto;align-self:center}
.gt-opt{font:700 10px var(--font);letter-spacing:.06em;cursor:pointer;padding:4px 9px;
  color:var(--dim);background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-sm)}
.gt-opt:hover{color:var(--fg);border-color:var(--fg)}
.gt-opt.on{color:var(--bg);background:var(--accent);border-color:var(--accent)}
.sw-row + .sw-row{border-top:1px solid var(--hairline)}
.sw-text{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 auto}
.sw-name{font:700 11px var(--font);letter-spacing:.14em;color:var(--type)}
.sw-desc{font:400 11px/1.5 var(--font);color:var(--dim)}
.sw{flex:0 0 auto;background:transparent;border:0;padding:2px;cursor:pointer;border-radius:var(--radius-pill);line-height:0}
.sw:focus-visible{outline:2px solid var(--check);outline-offset:2px}
.sw-track{display:block;position:relative;width:40px;height:23px;border-radius:var(--radius-pill);background:var(--bg-2);border:1px solid var(--border-strong);transition:background .16s var(--ease),border-color .16s var(--ease)}
.sw-knob{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--dim);transition:transform .16s var(--ease),background .16s var(--ease)}
.sw.on .sw-track{background:color-mix(in srgb,var(--check) 34%,transparent);border-color:var(--check)}
.sw.on .sw-knob{transform:translateX(17px);background:var(--check)}
.sw:hover:not(:disabled) .sw-track{border-color:var(--fg)}
.sw:disabled{cursor:not-allowed;opacity:.45}
/* UNKNOWN is a THIRD position, never a styled OFF — a control plane that did
   not answer must not read as a confident off. */
.sw.unknown .sw-track{background:repeating-linear-gradient(45deg,transparent,transparent 3px,var(--bg-2) 3px,var(--bg-2) 6px);border-style:dashed}
.sw.unknown .sw-knob{left:50%;transform:translateX(-50%);background:var(--dim)}
@media (prefers-reduced-motion:reduce){.sw-track,.sw-knob{transition:none}}
.sw-note{font:400 11px/1.5 var(--font);color:var(--dim);padding:0 0 8px}
.sw-note.bad{color:var(--bad)}
.sw-warn{font:400 11px/1.55 var(--font);color:var(--warn);border-left:2px solid var(--warn);padding:2px 0 6px 9px;margin:0 0 8px}

.drawer .dw-foot{padding:11px 18px;border-top:1px solid var(--hairline)}
.drawer .dw-note{font:400 10px var(--font);color:var(--dim)}

/* A tool card. An unwired tool is DIMMED and says why — never a live-looking
   control that quietly does nothing. */
.tool{display:flex;flex-direction:column;gap:6px;padding:11px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--panel,rgba(0,0,0,.22))}
.tool.unwired{border-color:var(--hairline)}
/* ARRIVED HERE FROM A REFUSAL. The drawer is long and this is the one row that
   was asked for, so it is marked and says why — a highlight with no explanation
   is decoration. */
.tool.tool-focused{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tool-why{font:400 10.5px/1.6 var(--font);color:var(--accent)}
.tool-row1{display:flex;align-items:center;gap:8px}
.tool-name{font:700 12.5px var(--font);color:var(--type)}
.tool-badge{margin-left:auto;font:700 9px var(--font);letter-spacing:.12em;padding:3px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.tool-badge.ok{color:var(--check)}
.tool-badge.off{color:var(--dim)}
/* LOCAL — a tool contributed by this installation rather than shipped with the
   bench (see the external-manifest seam in control/tools.mjs). Informational,
   not status, so it is deliberately quieter than READY/BLOCKED and dashed to
   read as a provenance note rather than a second verdict. */
.tool-badge.local{color:var(--faint);border-style:dashed}
.tool-badge + .tool-badge{margin-left:6px}
.tool-blurb{font:400 10.5px/1.6 var(--font);color:var(--dim)}
.tool-missing{font:400 10.5px/1.6 var(--font);color:var(--warn,#e0b34d);padding:7px 9px;border-radius:var(--radius-sm);border:1px dashed var(--hairline)}
.tool-row2{display:flex;align-items:center;gap:7px}
.tool-id{font:400 10px var(--font-mono,var(--font));color:var(--dim);margin-right:auto}
/* The seams toggle is secondary to `run` — it explains, it does not act. */
.btn.tool-detail{color:var(--dim)}
.btn.tool-detail:hover:not(:disabled){color:var(--type);border-color:var(--fg)}
.tool-seams{margin:2px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font:400 10.5px/1.55 var(--font);color:var(--dim)}
.tool-seams li{padding-left:2px}

/* A declared argument. The label sits above the field so the drawer stays
   readable at 420px — a label beside a text input is the first thing to squeeze
   at this width. */
.tool-arg{display:flex;flex-direction:column;gap:4px}
.ta-label{font:700 9.5px var(--font);letter-spacing:.1em;color:var(--dim)}
.ta-input{font:400 11px var(--font-mono,var(--font));padding:6px 8px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--bg-2,rgba(0,0,0,.3));color:var(--type);width:100%;box-sizing:border-box}
.ta-input:focus{outline:none;border-color:var(--fg)}
.ta-help{font:400 9.5px var(--font);color:var(--dim)}

/* The outcome, in the tool's own words. SENT is not ACCEPTED and the note says
   so — a green tick here would leave an operator wondering why recall still
   returns nothing while the request sits unaccepted on someone's dashboard. */
.tool-result{display:flex;flex-direction:column;gap:4px;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--bg-2,rgba(0,0,0,.28))}
.tool-result.ok{border-color:var(--check)}
.tool-result.bad{border-color:var(--danger)}
/* In flight: the job's own output streams into .tool-log below; the clock in
   .tr-lines is the honest liveness signal, so the frame stays quiet. */
.tool-result.live{border-color:var(--accent)}
.tr-code{font:700 9.5px var(--font);letter-spacing:.12em}
.tool-result.ok .tr-code{color:var(--check)}
.tool-result.bad .tr-code{color:var(--danger)}
.tool-result.live .tr-code{color:var(--accent)}
.tr-lines{font:400 10.5px/1.55 var(--font-mono,var(--font));color:var(--type);overflow-wrap:anywhere}
.tr-note{font:400 10px/1.5 var(--font);color:var(--dim)}
/* THE COMMAND'S OWN OUTPUT. Capped and scrollable: a docker build is hundreds
   of lines, and a result box that pushes the other tools off-screen is a
   reason not to look at it. */
.tool-log{margin:2px 0 0;max-height:220px;overflow:auto;padding:8px;border-radius:var(--radius-sm);background:var(--bg-1,rgba(0,0,0,.35));font:400 10px/1.5 var(--font-mono,monospace);color:var(--dim);white-space:pre-wrap;overflow-wrap:anywhere}
.dw-empty{font:400 11px/1.6 var(--font);color:var(--dim);padding:18px 0;text-align:center}
.starting{display:flex;align-items:center;gap:11px;padding:9px 14px;border:1px solid var(--fg);border-radius:var(--radius-sm);flex-wrap:wrap}
.starting .ttl{color:var(--type)}

/* The elapsed counter is the honest signal; the dots are decoration. Under
   reduced motion the dots hold still and the counter still proves liveness. */

/* ── TUI MIRROR — the live view's own terminal (panels/tui.js) ────────────

   THE GRID IS NO LONGER SIZED FROM THIS FILE. `--tui-w`/`--tui-h`/
   `--tui-scale` and the transform that used them are gone with the constants
   they came from: the box they reserved was 6.8% wider than the grid it held,
   because the character advance behind it was a 14px measurement of a font
   that never loaded. `.tui-term` is an empty node xterm.js owns; it takes the
   card's width and its own natural height, and panels/tui.js solves for the
   font size that makes 130 columns fill exactly that width. Nothing here may
   set a width, a height or a transform on it — that would put a second opinion
   about the terminal's size in a second file, which is the whole defect. */
.tui-mirror{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.tui-screen{flex:1;min-height:0;width:100%;min-width:0;border:1px solid var(--hairline);border-radius:var(--radius-md);background:var(--bg);padding:5px 8px;box-sizing:border-box;overflow:hidden}
.tui-term{width:100%;min-width:0}
/* THE YIELD RULE IS A TOGGLE, NOT A SWAP. The feed and the terminal are both
   in the tree at all times so the terminal's node is never rebuilt; exactly one
   of them is displayed. See panels/tui.js `mirrorScreen`. */
.tui-feed,.tui-term{min-width:0}
.tui-feed.off,.tui-term.off{display:none}
/* A silent terminal must LOOK silent: the last frame is held and dimmed, and
   nothing about it animates. */
.tui-term.dim{opacity:.55}
.tui-banner{padding:8px 10px;border-bottom:1px solid var(--hairline)}
/* xterm draws its own cursor layer; this mirror never accepts a keystroke, so
   the cursor and the input helper have no business being visible or reachable.
   The theme already makes the cursor transparent — this is the belt to that
   brace, and it also keeps the helper textarea out of the tab order. */
.tui-term .xterm-helper-textarea{display:none!important}
.tui-term .xterm-cursor-layer{display:none!important}
.tui-term .xterm{padding:0}

/* BOTH THE HEAD AND THE FOOT WRAP. The card is half the board wide and these
   rows carry more than fits on one line of it. Wrapping onto a second line is
   the correct answer; the failure mode being prevented is the flex default,
   which instead SHRINKS every item — and shrank DETACH & CLOSE, the one
   destructive control on this surface, into a three-line stack of broken
   words. Nothing here shrinks; the spacer absorbs the slack and the rest wraps
   whole. The identity note is the single exception: it may ellipsize, because
   an abbreviated pty id is still readable and a wrapped one is not. */
.tui-head{flex-wrap:wrap;row-gap:7px}
.tui-head>*{flex:none}
.tui-head .note{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tui-head .spacer{flex:1 1 0}
.tui-head .btn,.tui-head .tag{white-space:nowrap}
.tui-foot{flex-wrap:wrap;row-gap:6px}
.tui-foot .note{flex:1 1 320px;min-width:0}

/* ══════════════════════════════════════════════════════════════════════════
   PANEL INTERNALS

   Everything below was EMITTED by the panel modules but had no definition
   after the token rewrite — 69 classes and 8 custom properties across the
   nine live panels. The Gate Wall in particular rendered as empty spans: an
   entire axis of the board's two-axis argument was invisible on screen.

   Rules here are keyed to the markup the panels ACTUALLY emit, captured by
   rendering each module under Node against a live /api/board payload rather
   than read off the source by eye.
   ══════════════════════════════════════════════════════════════════════════ */

/* The live view panel takes the row's slack; its terminal fills what is left. */
.curve{flex:1 1 0}

/* ── RUN LEDGER — row cells. Only the long identity columns may ellipsize:
   a truncated number would be wrong, a truncated model name is abbreviated. */

.arm{font-weight:700;letter-spacing:.06em}
.model{color:var(--fg)}
.delta{color:var(--type);white-space:nowrap}
.delta.worse{color:var(--danger)}

.ledger-empty{padding:18px;border:1px dashed var(--border-strong);border-radius:var(--radius-md);font:400 12.5px/1.6 var(--font);color:var(--dim)}
/* THE STATS STRIP. It LEADS the card now — the baselines table sits under it,
   the reverse of the order they used to be drawn in. The treatment is the same
   one inverted: a 2px rule and the rounded bleed move to the BOTTOM and TOP of
   the block respectively, so the block still reads as a readout rather than a
   peer row. The --bg ground against its peers' --bg-2 is what does most of
   that work and is unchanged. */
.ledger-lead{background:var(--bg);border-bottom:2px solid var(--fg);border-top:0;margin:calc(var(--pad) * -1) calc(var(--pad) * -1) 0;padding:12px var(--pad);border-radius:var(--radius-xl) var(--radius-xl) 0 0}
/* EFFICIENCY and CORRECTNESS headline numbers — same size, side by side,
   never combined. The hard rule made typographic. */
.big{flex-direction:row;gap:26px;align-items:baseline;flex-wrap:wrap;font:700 var(--fs-metric)/1.1 var(--font);color:var(--type)}
.big .null,.big .muted{font:400 14px var(--font)}
/* ── THE TWO STAT ROWS ────────────────────────────────────────────────────
   BENCHMARK readings and CUSTOM readings, one row each, separated by a rule
   and never sharing one. The custom row is dimmed and stays visually second
   because it reads services the bench does not ship — a stranger's clone has
   none of them, and a number from a contributor's own surroundings must never
   be mistaken for a benchmark result. See control/runstats.mjs.

   FIXED SLOTS, EQUAL WIDTH. The strip keeps its geometry whether a slot holds
   a number or is still waiting for one, so filling a placeholder never moves
   anything already on screen. */
.strip{display:flex;align-items:baseline;gap:14px;min-width:0}
.strip+.strip{border-top:1px solid var(--hairline);padding-top:10px}
.strip.custom{opacity:.72}
.strip>.kick.zone{flex:0 0 92px;color:var(--dim);letter-spacing:.08em}
.strip.custom>.kick.zone{color:var(--danger);opacity:.85}
.slots{display:flex;align-items:baseline;gap:12px;flex:1 1 0;min-width:0;overflow:hidden}
.slot{display:flex;flex-direction:column;gap:2px;flex:1 1 0;min-width:0}
.slot .kick{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.vacant{opacity:.4}
.snum{font:700 var(--fs-metric)/1.1 var(--font);color:var(--type)}
.snum.null{color:var(--dim)}
.sep{color:var(--hairline);font:400 14px var(--font)}

/* ── THE BASELINES CARD ───────────────────────────────────────────────────
   One row per measured floor; that floor's ON runs and its own frozen feeds
   nested inside it.

   THE INDENT IS THE ARGUMENT, so it is drawn with a RULE rather than padding:
   the drawer carries a left border, which is what makes "these runs belong to
   that floor" survive a screenshot, a scroll, and greyscale. Padding alone
   reads as a layout preference and can be mistaken for one. */

/* EIGHT COLUMNS, shared by the header and every baseline row so they cannot
   drift. The design specimen's 26 / 210 / 74 / 1fr / 84 / 84 / 128, plus a
   trailing auto track for [+ run] — the sheet shows no control because it is a
   specimen of the layout, and the runs it describes have to start somewhere. */
.blcols,.blrow{display:grid;grid-template-columns:26px minmax(0,1.3fr) 74px minmax(0,150px) minmax(0,130px) minmax(0,1.1fr) 70px auto;gap:10px;align-items:baseline;min-width:0}
.blcols{font:700 10px/1 var(--font);letter-spacing:.14em;color:var(--dim);padding:9px 4px;border-bottom:1px solid var(--hairline)}
.blcols>span,.blrow>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl .ledger-head{align-items:center}
/* THE SUBTITLE IS ONE LINE AND ELLIPSIZES. Wrapped, it pushes the count, the
   serial chip and [+ BASELINE] onto a second row and the header stops reading as
   a header — the same rule `.phead .sub` already applies for the same reason. */
.bl .ledger-head .sub{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* The count sits next to the title, not in the rows: "how much has this bench
   measured" is a property of the card. */
.blcount{font:400 12px var(--font);color:var(--fg);white-space:nowrap}
.blnew{white-space:nowrap}

.blwrap{border-bottom:1px solid var(--hairline);min-width:0}
.blwrap.open{background:var(--bg-2);border-bottom-color:var(--fg)}
/* A RUNNING BASELINE SITS ON THE RAISED SURFACE while its peers sit on the
   canvas — the same device the pinned floor uses. It is doing something; the
   others have finished. No animation: a stopped board must never imply motion,
   and a pulse here would be indistinguishable from one on a dead cell. */
.blwrap.running{background:var(--bg-2)}
/* The row is the click target for its contents, so it gets the pointer and a
   hover — a control that expands must look like one. */
.blrow{padding:10px 4px;cursor:pointer;font:400 12.5px/1.35 var(--font);color:var(--fg)}
.blrow:hover{background:color-mix(in srgb, var(--fg) 5%, transparent)}
.blcaret{color:var(--dim);font-size:11px}
/* THE BASELINE ID IS THE ANCHOR of the row: full contrast, full weight, so a
   six-row card scans by floor. */
.blid{font-weight:700;color:var(--type)}
.blkind{font:700 10.5px var(--font);letter-spacing:.1em;color:var(--fg)}
/* CLOUD IS THE ONLY OFF-PALETTE MARK ON THIS ROW, and it is not --danger: a
   cloud baseline is not a fault, it is a different substrate, and colouring it
   with the failure hue would read as one. */
.blkind.cloud{color:var(--link)}
.blmodel{color:var(--fg)}
.blstate{font:700 10.5px var(--font);letter-spacing:.12em;color:var(--fg)}
/* THE ACTION CELL — [feed] then [+ run]. Right-aligned in its own track so the
   buttons never shift with the width of the readout beside them, and READ IN
   THAT ORDER: opening a record is the safe act and the common one; starting a
   multi-hour cell is neither, so it sits furthest from the row being scanned. */
.blact{display:flex;justify-content:flex-end;gap:8px;align-items:baseline}
/* THE FEED MARK — a READOUT, never a control. It says whether the DATA FEED
   card is showing this row's cell. Which cell that is, is the cell strip's
   choice alone; the row only expands. */
.blfeed{font:700 9.5px var(--font);letter-spacing:.14em;color:var(--dim);white-space:nowrap}
.blfeed.on{color:var(--bg);background:var(--fg);border-radius:var(--radius-pill);padding:2px 8px}
.blfeed.live{color:var(--type)}
/* THE SELECTED ROW, marked on the row itself so "which record am I reading" is
   answerable from the list without reading each right-hand cell. */
/* THE SUPERSEDED GROUP — batches measured on something other than the current
   code. Folded, dimmed, readable; never a floor. */
.blsup{border-top:1px solid var(--hairline);margin-top:4px}
.blsup-head{display:flex;align-items:baseline;gap:10px;padding:10px 4px;cursor:pointer;font:700 10.5px var(--font);letter-spacing:.12em;color:var(--dim)}
.blsup-head:hover{background:color-mix(in srgb, var(--fg) 5%, transparent)}
.blsup-head .note{font-weight:400;letter-spacing:0}
.blsup .blwrap{opacity:.7}
.blrow.feeding{background:color-mix(in srgb, var(--fg) 7%, transparent)}
.blstate.running{color:var(--type)}
.blstate.void{color:var(--danger)}
/* Stopped at the context limit. Amber, not red: a result, not a fault. Allowed
   to wrap — the 128px state column holds "CONTEXT" and "EXHAUSTED" on two lines
   rather than clipping the word the row exists to show. */
.blstate.exhausted,.blstate.ctx{color:var(--warn,#e0b34d);white-space:normal;line-height:1.25}
/* THE VOID REASON AND THE LAUNCH REFUSAL, printed under the row they belong to.
   Never a tooltip: a void floor's numbers look ordinary, so the sentence
   explaining them has to be on screen beside them — and a disabled [+ run] that
   does not say what it is waiting for is indistinguishable from a broken one. */
.blwhy{padding:0 4px 10px 36px;font:400 11.5px/1.5 var(--font)}
/* ── THE BATCH'S CELLS ── inside an open row: one line per cell of the batch,
   void ones included (marked, never dropped). */
.bccols,.bcrow{display:grid;grid-template-columns:62px 74px 80px minmax(170px,1.4fr) 64px 76px 76px minmax(120px,1fr);gap:10px;align-items:baseline;min-width:0}
.bccols{font:700 10px/1 var(--font);letter-spacing:.14em;color:var(--dim);padding-bottom:5px;border-bottom:1px solid var(--hairline)}
.bcrow{padding:6px 0;font:400 12px var(--font);color:var(--fg);border-bottom:1px solid var(--hairline)}
.bccols>span,.bcrow>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcseq{color:var(--type)}
.bcrow.bc-void{opacity:.8}
/* THE TWO SENTENCES THAT ARGUE THE NESTING. Side by side at equal weight,
   because they are two halves of one claim. */
/* Last block on the card now that the stat strip leads it, so the rule that
   separated it from the strip below moves above it. */
.blnest{display:flex;gap:22px;flex-wrap:wrap;padding:11px 4px;border-top:1px solid var(--border-strong);font:400 11.5px/1.5 var(--font);color:var(--dim)}
.blnest>span{flex:1 1 300px;min-width:0}

/* LEVEL 2 — the drawer: this floor's runs, then its own frozen record. */
.blacc{padding:2px 0 12px 42px;border-left:1px solid var(--border-strong);margin-left:12px;display:flex;flex-direction:column;gap:14px;min-width:0}

/* THE RUN TABLE, and the section headline above it. */
.rsec{display:flex;flex-direction:column;gap:6px;min-width:0}
.rsecline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
/* BEST CARRIES ITS AXIS IN THE TEXT ("BEST −14 TURNS"), never bare: efficiency
   and correctness are never blended, and an unqualified superlative is the
   shortest possible way to break that. */
.pbest{font:700 10.5px var(--font);letter-spacing:.12em}
.rempty{padding:10px 0;font:400 11.5px/1.6 var(--font);color:var(--dim)}
.rcols,.rrow{display:grid;grid-template-columns:26px 100px 108px minmax(0,1fr) 96px minmax(128px,auto);gap:10px;align-items:baseline;min-width:0}
.rcols{font:700 10px/1 var(--font);letter-spacing:.14em;color:var(--dim);padding-bottom:5px;border-bottom:1px solid var(--hairline)}
.rrow{padding:6px 0;font:400 12px var(--font);color:var(--dim);border-bottom:1px solid var(--hairline)}
.rcols>span,.rrow>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rseq{color:var(--fg)}
.rdetail{color:var(--dim)}
/* ── DATA FEED ────────────────────────────────────────────────────────────
   TWO columns: spine | feed. The third column (extraction) was removed in
   WO-BOARD-EXTRACT-1 — extraction is now a popout, because a run-scoped
   column could only ever show ONE extraction and vanished behind a live run.
   The 380px track went with it: leaving it would reserve dead space that
   nothing renders into, and the feed would stay artificially narrow. */
/* THE CARD IS SHOWING A RECORD, SAID ON THE CARD. A frozen transcript and a
   live cell that has gone silent are identical in the rows, so the difference
   is stated in the subtitle rather than left to be inferred. It is a state
   mark, not a warning — a concluded run is the normal thing to be reading — so
   it takes the identity hue and the kicker treatment, never --danger. */
.feed-frozen{font:700 10px var(--font);letter-spacing:.14em;color:var(--type)}
.feed-live{font:700 10px var(--font);letter-spacing:.14em;color:var(--check)}
.feed-subject{color:var(--type)}
/* THE EXPORT ROW. Under the filters, above the rows — it acts on the whole
   record set, not on what the chips left, so it does not sit among them. The
   note beside it is the only feedback a clipboard write can give. */
/* THE EXPORT ROW. Under the filters, above the rows — it acts on the whole
   record set, not on what the chips left, so it does not sit among them.

   THE NOTE TRUNCATES. It carries the browser's own clipboard error verbatim,
   which can be a sentence; wrapping it pushed the feed box down and moved the
   rows under the reader's eye. */
.feed-copy{display:flex;align-items:baseline;gap:10px;padding:4px 0 2px;min-width:0}
.feed-copy .note{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* THE BUTTON. `.chip` alone sets only font and colour, so on a <button> it
   inherited the UA's WHITE background — the same defect the filter chips were
   fixed for. It takes the hollow treatment its neighbours have. */
.chip.fexport{
  font:700 11px var(--font);letter-spacing:.10em;
  background:transparent;border:1px solid var(--border-strong);color:var(--dim);
  border-radius:var(--radius-sm);padding:3px 9px;cursor:pointer;white-space:nowrap;
}
.chip.fexport:hover{color:var(--type);border-color:var(--fg)}

/* THE DISCONNECTION BANNER. It rides ABOVE the rows rather than replacing them
   — a dead upstream is a fact about the stream, not about the rows already
   held — so it is sticky: scrolling a four-thousand-row feed must not scroll
   the warning out of sight and leave the rows looking current. */
.feed-banner{position:sticky;top:0;z-index:1;background:var(--bg-2);border-bottom:1px solid var(--danger)}

/* ── SCROLLBARS INSIDE THE FEED BOXES ─────────────────────────────────────
   The OS default is a light chunky bar on a dark panel — it reads as a piece of
   chrome from another application sitting inside the card. Thin, on the card's
   own palette, and always present so the geometry does not shift when a list
   grows past the box. */
.evbox{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.evbox::-webkit-scrollbar{width:10px;height:10px}
.evbox::-webkit-scrollbar-track{background:transparent}
.evbox::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;border:3px solid var(--bg)}
.evbox::-webkit-scrollbar-thumb:hover{background:var(--fg)}
/* ── THE CONDENSED BACKEND ROW ────────────────────────────────────────────
   A cell produces ~630 backend records and 585 of them are one gate result
   each, all in the same second. Folded into the attempt that closed them, the
   forty-five records that say what the harness DID become findable — and the
   gates are one click inside the row that owns them, never discarded.

   THE FOLD MARK SITS IN THE DETAIL COLUMN, not in its own track: it belongs to
   the row it summarises, and a separate column would reserve width on every
   ordinary row to say nothing. */
.bkfold{margin-left:10px;font:700 10.5px var(--font);letter-spacing:.1em;color:var(--type)}
/* THE FOLDED GATES. Three tracks — verdict, gate id, duration — so a failing
   gate is found by scanning ONE column rather than reading sentences. */
.bkkids{display:flex;flex-direction:column;gap:2px;margin-top:8px;padding-top:8px;border-top:1px solid var(--hairline)}
.bkkid{display:grid;grid-template-columns:52px minmax(0,1fr) 64px;gap:10px;align-items:baseline;font:400 11.5px/1.5 var(--font);color:var(--dim)}
.bkst{font:700 10px var(--font);letter-spacing:.1em;color:var(--dim)}
/* PASS IS QUIET, FAIL IS NOT. A failing gate is the expected outcome of a
   benchmark and is never an error — but it IS the thing being looked for, so it
   takes the identity hue rather than the danger one, which stays reserved for
   an instrument fault. */
.bkkid[data-status="fail"] .bkst{color:var(--type)}
.bkkid[data-status="fail"] .bkid{color:var(--fg)}
.bkid{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bkms{text-align:right;color:var(--dim)}
.live .phead{align-items:baseline}
/* THE LIVE CARD IS THE EVENT FEED. It was `340px | 1fr` — a spine column beside
   the feed — and the spine's two blocks now live on the gate wall. A heading
   stacked over a full-width feed is what is left, so it is a column, not a
   grid with one empty half. */
.live{display:flex;flex-direction:column;gap:8px;min-width:0}
.live-feed{display:flex;flex-direction:column;gap:8px;min-width:0}
.live-feed{min-height:0}
.spine{display:flex;flex-direction:column;gap:0}
/* A PHASE. The running phase carries a 3px left rule; a done phase does not.
   `.now` is the only bright tick — motion is never implied on a stopped cell. */
.ph{border:0;border-top:1px solid var(--hairline);border-radius:0;padding:3px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.ph.running{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.ph.pending{color:var(--dim)}
/* The cell stopped inside this phase (STOPPED) or before it (NOT RUN): never DONE. */
.ph.stopped{box-shadow:inset 3px 0 0 var(--warn,#e0b34d);padding-left:6px}
.ph.stopped .ph-top{color:var(--type)}
.ph.notrun{color:var(--dim)}
/* Verdict plus what the round changed, kept together on the row. */
.ph-out{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-left:auto;min-width:0}
.ph-val{white-space:nowrap}
.ph-churn{font:700 10px var(--font);letter-spacing:.08em;white-space:nowrap;color:var(--dim)}
.ph-churn.good{color:var(--check)}
.ph-churn.bad{color:var(--danger)}
.ph-churn.tot{color:var(--type)}
/* Run-card problems as identity deltas (+broke red / −fixed green), mirroring
   the churn colours: a regression is never green, a fix is never red. */
.cc-delta{color:var(--type)}
.cc-delta.good{color:var(--check)}
.cc-delta.bad{color:var(--danger)}
.ph-top{display:flex;align-items:center;gap:10px;font:700 11.5px var(--font);color:var(--dim)}
.ph.running .ph-top,.ph.done .ph-top{color:var(--type)}
.ph-state{letter-spacing:.1em;flex:none;min-width:58px;text-align:right;font-size:10px}
.ph-note{font:400 10.5px var(--font);color:var(--dim)}
.ticks{display:flex;gap:3px}
.tick{flex:1;height:6px;border:1px solid var(--border-strong);border-radius:1px}
.tick.done{background:var(--fg);border-color:var(--fg)}
.tick.now{background:var(--fg);border-color:var(--fg);opacity:.45}
/* THE ATTEMPT'S VERDICT, on the phase row that produced it. Read from the
   harness's own `attempt.end` record — a closed attempt states how it went, and
   the spine says so rather than leaving the operator to infer it by comparing
   this column against the gate wall beside it. */
.ph-verdict{font:700 10px var(--font);letter-spacing:.10em;white-space:nowrap;padding:0 6px;border-radius:var(--radius-sm);border:1px solid currentColor}
.ph-verdict.good{color:var(--check)}
.ph-verdict.bad{color:var(--danger)}

/* ── LIVE MOTION — climbing counters and spend floaters ───────────────────
   Painted by panels/tick.js. Everything here is DECORATION ON A NUMBER THAT IS
   ALREADY CORRECT: the value is in the markup before any of this runs, so a
   stylesheet that never loaded costs motion and never a reading.

   TABULAR FIGURES ARE THE WHOLE TRICK. A climbing counter in a proportional
   face reflows its own width on every frame and the row jitters; `tnum` fixes
   every digit to one advance so only the glyphs change. `.tkv` already sets it —
   this carries it to the counters that are NOT in a token row. */
.odo{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* The row is the floater's frame of reference, so the chip cannot be clipped by
   the number's own box. Rows are laid out already; this only adds the origin. */
.tkrow,.big,.ph{position:relative}

/* THE DELTA RISES AND LEAVES. It is deliberately small, monospaced and the
   check hue — this is a spend being acknowledged, not an alarm, and it must
   never compete with the reading it came from. `pointer-events:none` so a chip
   drifting over a control cannot swallow a click. */
.odo-float{
  position:absolute;right:0;bottom:100%;
  font:700 10.5px/1 var(--font);color:var(--check);
  white-space:nowrap;pointer-events:none;
  text-shadow:0 0 6px color-mix(in srgb, var(--bg) 70%, transparent);
  animation:odorise 1100ms cubic-bezier(.22,.61,.36,1) forwards;
}
@keyframes odorise{
  0%{opacity:0;transform:translateY(4px)}
  18%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(-16px)}
}

/* ── THE BUILD INDICATOR BREATHES WHILE IT IS BUILDING ────────────────────
   MOTION HERE MEANS ONE THING ONLY: this phase is running right now. It is on
   `.ph.running` and nothing else, so a pulsing box is never ambiguous — a done
   or pending phase is completely still, and a stalled cell stops moving because
   the phase stops being `running`, not because a timer ran out.

   THE GLOW IS ON THE BORDER, NOT THE FILL. A pulsing background under body text
   makes the text itself hard to read; a breathing edge is legible at a glance
   from across a room and does not touch the content. */
.ph.running{animation:phbreathe 2.4s ease-in-out infinite}
@keyframes phbreathe{
  0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--fg) 22%, transparent)}
  50%{box-shadow:0 0 0 3px color-mix(in srgb, var(--fg) 6%, transparent),0 0 12px 0 color-mix(in srgb, var(--fg) 16%, transparent)}
}
.ph.running .ph-state{animation:phword 2.4s ease-in-out infinite}
@keyframes phword{0%,100%{opacity:1}50%{opacity:.55}}

/* THE ACTIVE WORK ORDER GROWS. `.tick.now` was a dimmed square indistinguishable
   at a glance from a done one; it now swells and brightens on the same 2.4s
   phrase as the box, so the eye reads the whole indicator as one heartbeat
   rather than three things blinking independently. */
.tick.now{transform-origin:center;animation:tickgrow 2.4s ease-in-out infinite}
@keyframes tickgrow{
  0%,100%{opacity:.42;transform:scaleY(1)}
  50%{opacity:1;transform:scaleY(1.9)}
}

/* REDUCED MOTION: nothing travels, and nothing is withheld.
   The delta still appears and still fades — the information is the number, not
   the flight — and the running phase is marked by a STATIC brighter edge, so
   "which phase is live" survives without a heartbeat. */
@media (prefers-reduced-motion:reduce){
  .odo-float{animation:odofade 1400ms linear forwards}
  @keyframes odofade{0%{opacity:0}12%{opacity:1}70%{opacity:1}100%{opacity:0}}
  .ph.running,.ph.running .ph-state,.tick.now{animation:none}
  .ph.running{box-shadow:0 0 0 2px color-mix(in srgb, var(--fg) 12%, transparent)}
  .tick.now{opacity:1}
}
.prov-tot{display:flex;flex-direction:column;gap:5px;padding-top:9px;border-top:1px solid var(--hairline)}

/* ── TOKEN BREAKDOWN ──────────────────────────────────────────────────────
   Every category the agent reports, labelled, with a total that says what it
   summed. Replaces a bare unlabelled "138K" that was input+output only and
   silently dropped `reasoning` — the LARGEST category on a reasoning model.

   THE VALUE COLUMN NEVER CLIPS. The spine is a hard 340px track (300px under
   1600px), so the grid is `1fr auto`: the value takes the width its digits
   need and the LABEL ellipsises if anything has to give. A truncated word is
   recoverable from context; a truncated figure on a measuring instrument is a
   wrong reading. tabular-nums keeps the column edge straight as digits change
   every 2s, so the eye is not dragged by a re-flowing number. */
.tkbl{display:flex;flex-direction:column;gap:2px;margin-top:7px}
.tkhead{margin-bottom:3px}
.tkrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;min-width:0}
