   takes the identity hue rather than the danger one, which stays reserved for
   an instrument fault. */
.bkkid[data-status="fail"] .bkst{color:var(--type)}
.bkkid[data-status="fail"] .bkid{color:var(--fg)}
.bkid{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bkms{text-align:right;color:var(--dim)}
.live .phead{align-items:baseline}
/* THE LIVE CARD IS THE EVENT FEED. It was `340px | 1fr` — a spine column beside
   the feed — and the spine's two blocks now live on the gate wall. A heading
   stacked over a full-width feed is what is left, so it is a column, not a
   grid with one empty half. */
.live{display:flex;flex-direction:column;gap:8px;min-width:0}
.live-feed{display:flex;flex-direction:column;gap:8px;min-width:0}
.live-feed{min-height:0}
.spine{display:flex;flex-direction:column;gap:8px}
/* A PHASE. The running phase carries a 3px left rule; a done phase does not.
   `.now` is the only bright tick — motion is never implied on a stopped cell. */
.ph{border:1px solid var(--border);border-radius:var(--radius-md);padding:9px 11px;display:flex;flex-direction:column;gap:7px;min-width:0}
.ph.running{border-color:var(--fg);border-left-width:3px;background:var(--bg)}
.ph.done{border-color:var(--border)}
.ph.pending{border-color:var(--hairline);color:var(--dim)}
/* The cell stopped inside this phase (STOPPED) or before it (NOT RUN): never DONE. */
.ph.stopped{border-color:var(--warn,#e0b34d);border-left-width:3px}
.ph.stopped .ph-top{color:var(--type)}
.ph.notrun{border-color:var(--hairline);color:var(--dim)}
/* Verdict plus what the round changed, kept together on the row. */
.ph-out{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;justify-content:flex-end;min-width:0}
.ph-churn{font:700 10px var(--font);letter-spacing:.08em;white-space:nowrap;color:var(--dim)}
.ph-churn.good{color:var(--check)}
.ph-churn.bad{color:var(--danger)}
.ph-stage{font:700 10px var(--font);letter-spacing:.06em;color:var(--warn,#e0b34d);flex-basis:100%;text-align:right;white-space:normal}
.ph-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font:700 12px var(--font);color:var(--dim)}
.ph.running .ph-top,.ph.done .ph-top{color:var(--type)}
.ph-state{letter-spacing:.14em;flex:none}
.ph-note{font:400 11.5px var(--font);color:var(--dim)}
.ticks{display:flex;gap:3px}
.tick{flex:1;height:6px;border:1px solid var(--border-strong);border-radius:1px}
.tick.done{background:var(--fg);border-color:var(--fg)}
.tick.now{background:var(--fg);border-color:var(--fg);opacity:.45}
/* THE ATTEMPT'S VERDICT, on the phase row that produced it. Read from the
   harness's own `attempt.end` record — a closed attempt states how it went, and
   the spine says so rather than leaving the operator to infer it by comparing
   this column against the gate wall beside it. */
.ph-verdict{font:700 10px var(--font);letter-spacing:.10em;white-space:nowrap;padding:2px 6px;border-radius:var(--radius-sm);border:1px solid currentColor}
.ph-verdict.good{color:var(--check)}
.ph-verdict.bad{color:var(--danger)}

/* ── LIVE MOTION — climbing counters and spend floaters ───────────────────
   Painted by panels/tick.js. Everything here is DECORATION ON A NUMBER THAT IS
   ALREADY CORRECT: the value is in the markup before any of this runs, so a
   stylesheet that never loaded costs motion and never a reading.

   TABULAR FIGURES ARE THE WHOLE TRICK. A climbing counter in a proportional
   face reflows its own width on every frame and the row jitters; `tnum` fixes
   every digit to one advance so only the glyphs change. `.tkv` already sets it —
   this carries it to the counters that are NOT in a token row. */
.odo{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* The row is the floater's frame of reference, so the chip cannot be clipped by
   the number's own box. Rows are laid out already; this only adds the origin. */
.tkrow,.big,.ph{position:relative}

/* THE DELTA RISES AND LEAVES. It is deliberately small, monospaced and the
   check hue — this is a spend being acknowledged, not an alarm, and it must
   never compete with the reading it came from. `pointer-events:none` so a chip
   drifting over a control cannot swallow a click. */
.odo-float{
  position:absolute;right:0;bottom:100%;
  font:700 10.5px/1 var(--font);color:var(--check);
  white-space:nowrap;pointer-events:none;
  text-shadow:0 0 6px color-mix(in srgb, var(--bg) 70%, transparent);
  animation:odorise 1100ms cubic-bezier(.22,.61,.36,1) forwards;
}
@keyframes odorise{
  0%{opacity:0;transform:translateY(4px)}
  18%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(-16px)}
}

/* ── THE BUILD INDICATOR BREATHES WHILE IT IS BUILDING ────────────────────
   MOTION HERE MEANS ONE THING ONLY: this phase is running right now. It is on
   `.ph.running` and nothing else, so a pulsing box is never ambiguous — a done
   or pending phase is completely still, and a stalled cell stops moving because
   the phase stops being `running`, not because a timer ran out.

   THE GLOW IS ON THE BORDER, NOT THE FILL. A pulsing background under body text
   makes the text itself hard to read; a breathing edge is legible at a glance
   from across a room and does not touch the content. */
.ph.running{animation:phbreathe 2.4s ease-in-out infinite}
@keyframes phbreathe{
  0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--fg) 22%, transparent)}
  50%{box-shadow:0 0 0 3px color-mix(in srgb, var(--fg) 6%, transparent),0 0 12px 0 color-mix(in srgb, var(--fg) 16%, transparent)}
}
.ph.running .ph-state{animation:phword 2.4s ease-in-out infinite}
@keyframes phword{0%,100%{opacity:1}50%{opacity:.55}}

/* THE ACTIVE WORK ORDER GROWS. `.tick.now` was a dimmed square indistinguishable
   at a glance from a done one; it now swells and brightens on the same 2.4s
   phrase as the box, so the eye reads the whole indicator as one heartbeat
   rather than three things blinking independently. */
.tick.now{transform-origin:center;animation:tickgrow 2.4s ease-in-out infinite}
@keyframes tickgrow{
  0%,100%{opacity:.42;transform:scaleY(1)}
  50%{opacity:1;transform:scaleY(1.9)}
}

/* REDUCED MOTION: nothing travels, and nothing is withheld.
   The delta still appears and still fades — the information is the number, not
   the flight — and the running phase is marked by a STATIC brighter edge, so
   "which phase is live" survives without a heartbeat. */
@media (prefers-reduced-motion:reduce){
  .odo-float{animation:odofade 1400ms linear forwards}
  @keyframes odofade{0%{opacity:0}12%{opacity:1}70%{opacity:1}100%{opacity:0}}
  .ph.running,.ph.running .ph-state,.tick.now{animation:none}
  .ph.running{box-shadow:0 0 0 2px color-mix(in srgb, var(--fg) 12%, transparent)}
  .tick.now{opacity:1}
}
.prov-tot{display:flex;flex-direction:column;gap:5px;padding-top:9px;border-top:1px solid var(--hairline)}

/* ── THE RUNNING CELL ON THE GATE WALL, SPLIT DOWN THE MIDDLE ─────────────
   Left: what the cell has SPENT. Right: where it has GOT TO. Equal columns,
   because neither is a footnote to the other — the same 50/50 rule the axes row
   itself is built on.

   `align-items:start` so the shorter column does not stretch its own children:
   the spine's phase boxes must keep their own height, and a stretched token
   table would push its rule away from the rows it belongs to.

   `minmax(0,1fr)` on both, not `1fr` — a grid column's default minimum is
   min-content, and the token rows carry long unbroken figures that would
   otherwise push the column wider than its share and shove the spine off. */
.wall-run{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap);align-items:start;margin-top:9px;padding-top:9px;border-top:1px solid var(--hairline)}
.wr-col{min-width:0}
/* The totals block already drew its own rule when it sat alone at the foot of
   the card. The container carries it now, for both columns at once. */
.wall-run .prov-tot{padding-top:0;border-top:0}

/* HALF A CARD IS NARROW. The phase title and its state word share a row and no
   longer always fit on one line; wrapping is correct, clipping the phase name
   is not. */
.wall-run .ph-top{flex-wrap:wrap;row-gap:2px}

/* ONE COLUMN ONLY WHEN GENUINELY NARROW.
   The first attempt collapsed at 1400px, which is ABOVE the width this board is
   normally read at — so the split never appeared and the block just stacked, as
   it had before. The breakpoint has to be derived from the column the card can
   actually give, not from a round number:

     viewport 1265 -> wall card 574 -> two columns of ~277px
     viewport 1100 -> the axes row itself collapses, so the card takes the full
                      width and the columns get ~515px each

   277px comfortably holds a token row (a short label against a right-aligned
   figure) and a phase row. It stops working somewhere near 200px, which is a
   card of ~430px — so the split holds everywhere this board is usable and gives
   up only on a genuinely small screen, where one full-width column is better
   than two starved ones. */
@media (max-width:640px){
  .wall-run{grid-template-columns:minmax(0,1fr)}
}

/* ── TOKEN BREAKDOWN ──────────────────────────────────────────────────────
   Every category the agent reports, labelled, with a total that says what it
   summed. Replaces a bare unlabelled "138K" that was input+output only and
   silently dropped `reasoning` — the LARGEST category on a reasoning model.

   THE VALUE COLUMN NEVER CLIPS. The spine is a hard 340px track (300px under
   1600px), so the grid is `1fr auto`: the value takes the width its digits
   need and the LABEL ellipsises if anything has to give. A truncated word is
   recoverable from context; a truncated figure on a measuring instrument is a
   wrong reading. tabular-nums keeps the column edge straight as digits change
   every 2s, so the eye is not dragged by a re-flowing number. */
.tkbl{display:flex;flex-direction:column;gap:2px;margin-top:7px}
.tkhead{margin-bottom:3px}
.tkrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;min-width:0}
.tkl{font:400 11.5px/1.5 var(--font);color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tkv{font:400 12px/1.5 var(--font);color:var(--fg);white-space:nowrap;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.tkv .null{font:400 11px var(--font)}
/* THE TOTAL. A rule above it and brighter type. EVERY row above the rule is
   in it — including cache read, which is billed and is where the cost of a
   larger injected prompt actually lands. No category renders dimmed: an
   excluded-looking figure invites the reader to discount it, and the whole
   defect this block fixes was a total that quietly discounted categories. */
.tkrow.tksum{margin-top:4px;padding-top:5px;border-top:1px solid var(--hairline)}
.tkrow.tksum .tkl{color:var(--type);font-weight:700;letter-spacing:.04em}
.tkrow.tksum .tkv{color:var(--type);font-weight:700}
/* THE TURN COUNT RIDES BESIDE THE TOTAL, never inside it. Dimmer and carrying
   its own unit word, so two numbers under a heading that says TOKENS cannot be
   misread as two token figures — or as factors of one another. */
.tkrow.tksum .tkbar{color:var(--dim);font-weight:400;margin:0 7px}
.tkrow.tksum .tkturns{color:var(--fg);font-weight:400}
/* A TOTAL THAT SUMS A SUBSET IS MARKED, never presented as whole. */
.tkpartial{color:var(--warn,#e0b34d)}
/* CACHE HIT RATE. A DERIVED RATE, not a summand — its own rule separates it
   from the five categories above so nobody reads it as part of the total.
   It is bright, not dimmed: on a memory system that injects into the prompt
   this is the number that reveals a cost blow-up the token total cannot show,
   because busting a prefix cache multiplies the PRICE of tokens without
   moving the COUNT. */
.tkrow.tkrate{margin-top:7px;padding-top:6px;border-top:1px solid var(--hairline)}
.tkrow.tkrate .tkl{color:var(--type);font-weight:700;letter-spacing:.04em}
.tkrow.tkrate .tkv{color:var(--type);font-weight:700}
/* The denominator's other half, carried directly beneath so the rate is
   auditable on the surface rather than taken on trust. No rule, no bold. */
.tkrow.tkrate.tksubrow{margin-top:0;padding-top:0;border-top:0}
.tkrow.tkrate.tksubrow .tkl,.tkrow.tkrate.tksubrow .tkv{color:var(--dim);font-weight:400;letter-spacing:0}
.tknote{font:400 11px/1.5 var(--font);color:var(--dim);margin-top:6px}

/* ── EVENT FEED ───────────────────────────────────────────────────────────
   Collapsed rows are a constant 34px. An EXPANDED row (.evrow.open — click
   reveals the captured text) is deliberately taller, and safe: the trim
   compensation measures real per-child heights and sticky-bottom re-anchors
   on the real scrollHeight (live.js), so no arithmetic depends on the
   constant. */
.feed-head{flex-wrap:wrap;gap:8px}
.evbox{flex:1;min-height:240px;max-height:420px;overflow-y:auto;overflow-x:hidden;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg)}
.evrow{display:grid;grid-template-columns:74px 22px auto minmax(0,1fr);gap:10px;align-items:center;height:34px;padding:0 11px;border-bottom:1px solid var(--hairline);font:400 12.5px var(--font);color:var(--fg)}
/* Scoped to the event feed: backend rows (.evrow.bkrow in #sc-backend) share
   the class but are NOT clickable — a pointer there would promise a lie.
   Open keeps the compact line at its 34px row and gives the body its own. */
#sc-events .evrow{cursor:pointer}
.evrow.open{height:auto;grid-template-rows:34px auto}
.evt{color:var(--dim);font-size:11.5px}
.evmark{text-align:center;font-weight:700;color:var(--fg)}
.evname{color:var(--type);white-space:nowrap}
.evdetail{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.evrow.error .evmark,.evrow.error .evname,.evrow.error .evdetail{color:var(--danger)}
.evrow.thinking .evname,.evrow.thinking .evdetail{color:var(--dim);font-style:italic}
.evrow.lifecycle .evname{color:var(--dim)}
/* USER TURNS — the verbatim text handed to the model. Marked with the type
   colour and a left rule so a turn the model was GIVEN is never mistaken for
   something the model DID: everything else in this feed is the agent acting. */
.evrow.user{box-shadow:inset 2px 0 0 var(--type)}
.evrow.user .evmark,.evrow.user .evname{color:var(--type)}
/* HARNESS / GRADING — the verdict channel (control/gate-events.mjs).
   PROMINENT ON PURPOSE, and louder than any agent row. Between attempts the
   agent is idle BY DESIGN while grading runs, so every other kind falls silent
   and this is the only line still moving — it is the sole signal separating
   "grading" from "wedged", the exact ambiguity that cost 32 unobserved minutes
   on 2026-08-12.

   A FULL-WIDTH TINT, not just a coloured mark. The other kinds are events in a
   stream; these are the boundaries BETWEEN attempts, so they read as rules
   across the feed rather than as entries within it. The detail is left bright
   because the gate counts it carries are the payload, not decoration. */
.evrow.harness{box-shadow:inset 3px 0 0 var(--check);background:color-mix(in srgb,var(--check) 7%,transparent)}
.evrow.harness .evmark,.evrow.harness .evname{color:var(--check);font-weight:700}
.evrow.harness .evdetail{color:var(--type)}
.evpath{font-size:12px}
/* EXPANDED DETAIL (click a row). The body spans the full grid width under the
   compact line; the label states what the operator is reading — verbatim,
   truncated, or nothing captured — because a cut prompt presented silently as
   complete is the same lie as a partial delta presented as a result. The text
   WRAPS (never scrolls sideways inside the feed) and caps at 40vh with its own
   scroll. No height/margin/transform transition: the no-animation contract
   just below governs expansion too. */
.evbody{grid-column:1/-1;min-width:0;padding:8px 0 10px;border-top:1px solid var(--hairline)}
.evlbl{display:block;color:var(--dim);font-size:11px;letter-spacing:.02em;margin-bottom:5px}
.evtext{margin:0;font-family:inherit;font-size:12px;line-height:1.55;color:var(--fg);white-space:pre-wrap;word-break:break-word;max-height:40vh;overflow:auto}
/* THE ONLY MOTION ON THE BOARD. Background + inset rule, one shot. Never
   height/margin/transform — those would reflow the feed mid-scroll. */
@keyframes evflash{from{background:color-mix(in srgb,var(--fg) 14%,transparent);box-shadow:inset 3px 0 0 var(--fg)}to{background:transparent;box-shadow:inset 3px 0 0 transparent}}
.evrow.fresh{animation:evflash 1s var(--ease) 1}
.evrow.fresh.error{animation-duration:1.6s}
@media (prefers-reduced-motion:reduce){.evrow.fresh{animation:none;box-shadow:inset 3px 0 0 var(--fg)}}
.pill{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;font:700 11px var(--font);letter-spacing:.14em;color:var(--bg);background:var(--fg);border:0;border-radius:var(--radius-pill);padding:5px 14px;cursor:pointer;z-index:5}
.live-feed{position:relative}
.pad{padding:18px}

/* ── HONESTY RAIL ─────────────────────────────────────────────────────────
   SIX ACROSS at 1920 (artifact §8.1), reflowing to auto-fit on narrow
   viewports. It was inheriting flex-direction:column from the panel rule and
   stacking as six full-width blocks down the page. */
.rail{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;background:transparent;border:0;padding:0}
.railbox{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.label{font:700 10.5px var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.railval{font:700 15px var(--font);color:var(--type);word-break:break-word}
.railval .label{font-size:10.5px;color:var(--dim)}
.railnote{font:400 11.5px/1.45 var(--font);color:var(--dim)}

/* ── RECALL (demoted) ─────────────────────────────────────────────────────
   Proves retrieval fires. Deliberately the quietest panel on the board. */
.pbody{display:flex;flex-direction:column;gap:8px;min-width:0;padding:4px 0}
.collect{font:700 15px var(--font);letter-spacing:.12em;color:var(--type)}
.ident{font:400 var(--fs-ident) var(--font);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--hairline);font:400 12px var(--font)}
.disp{font-weight:700;flex:none}
.atomic{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);font:400 12.5px/1.6 var(--font);color:var(--fg)}
.state{font-weight:700;letter-spacing:.1em}
.fail{color:var(--danger);font-family:var(--font)}

/* ── TUI POPOUT ───────────────────────────────────────────────────────────
   The window is sized to the 40×130 character grid by tui.js inline; these
   rules must never impose a width that would squeeze that grid. */
.tui-brand{font:700 12px var(--font);color:var(--type);flex:none}
.tui-stat{font:400 12px var(--font);color:var(--fg);flex:none}
/* ── STOP CONTROL (panels/runstart.js) ─────────────────────────────────────
   Only rendered while a cell is live. The confirm is danger-coloured; the
   opener is not, because looking at what stopping would do is free. */

.note.bad{color:var(--bad,#c46a6a)}

/* ── ROUTERS DRAWER (panels/routers.js) ────────────────────────────────────
   Credentials are set here. The opener carries a dot when no key resolves, so a
   missing capability is visible before it becomes a refusal. */
.rt-card{border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px}
.rt-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rt-name{font:700 12px var(--font);color:var(--type)}
.rt-badge{font:700 9px var(--font);letter-spacing:.12em;color:var(--dim);border:1px solid var(--border-strong);border-radius:2px;padding:1px 4px}
.rt-var{font:400 10.5px var(--font);color:var(--dim)}
.rt-note{font:400 11px/1.5 var(--font);color:var(--dim);margin-top:6px}
.rt-status{margin:9px 0}
.rt-state{font:700 10.5px var(--font);letter-spacing:.14em;display:block}
.rt-set{color:var(--ok,#5fae7a)}
.rt-unset{color:var(--warn,#c8a24a)}
.rt-meta{font:400 10.5px/1.5 var(--font);color:var(--dim);display:block;margin-top:3px}
.rt-form{display:flex;gap:6px;margin-top:8px}
.rt-input{flex:1;font:400 12px var(--font);background:var(--bg);color:var(--type);border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:6px 8px}
.rt-save{font:700 10.5px var(--font);letter-spacing:.1em;background:none;color:var(--type);border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:6px 10px;cursor:pointer}
.rt-save:disabled{color:var(--dim);opacity:.6;cursor:not-allowed}
.rt-result{font:400 10.5px/1.5 var(--font);margin-top:8px}
.rt-result.ok{color:var(--ok,#5fae7a)}
.rt-result.bad{color:var(--bad,#c46a6a)}
.rt-empty{font:400 11.5px var(--font);color:var(--dim);padding:10px 0}
.rt-empty.bad{color:var(--bad,#c46a6a)}

/* ── STARTUP FEED (panels/startup.js) ──────────────────────────────────────
   Occupies the TUI grid until a real terminal frame paints, then yields.

   REPLACES `.tui-state` / `.tui-line`, which styled the five placeholder
   screens the feed absorbed. Those rules are deleted along with their markup —
   a stylesheet that keeps definitions for classes nothing emits is how the
   sheet and the panels drift apart, which is what style-coverage.test.mjs
   exists to catch. */
.sfeed{display:flex;flex-direction:column;height:100%;min-height:0;font-family:var(--font)}
.sfeed-head{display:flex;align-items:baseline;gap:12px;padding:10px 12px;border-bottom:1px solid var(--hairline);flex:none}
/* THE VERDICT IS THE HEADLINE. One line answering "can a benchmark start right
   now" — read before any individual row, and the only text here that is allowed
   to carry the danger hue at full weight. */
.sfeed-verdict{font:400 12px var(--font);color:var(--dim)}
.sfeed-verdict.bad{color:var(--danger);font-weight:700}
.sfeed-rows{flex:1 1 auto;min-height:0;overflow:auto;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.sfeed-foot{flex:none;padding:8px 12px;border-top:1px solid var(--hairline);font:400 11px/1.5 var(--font);color:var(--dim)}

/* ONE ROW PER PROCESS. A four-column grid so the state word and the detail
   align down the list — a ragged left edge on a status list makes scanning for
   the one broken row into reading, which defeats the purpose. `why` and
   `reason` span the full width beneath. */
.sfrow{display:grid;grid-template-columns:10px minmax(0,190px) 74px minmax(0,1fr);gap:10px;align-items:baseline;padding:7px 8px;border:1px solid transparent;border-radius:var(--radius-sm)}
/* ONLY `bad` GETS A BOX. Drawing a border around every row would make the
   blocking one just another row in a grid; leaving the healthy rows unframed is
   what lets the failure carry weight without any colour being added. */
.sfrow.bad{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 7%,transparent)}
.sfrow.off,.sfrow.idle{opacity:.62}
.sfdot{width:8px;height:8px;border-radius:50%;align-self:center;background:var(--dim)}
.sfdot.ok,.sfdot.busy{background:var(--check)}
.sfdot.bad{background:var(--danger)}
/* OFF AND IDLE ARE HOLLOW — absence drawn as absence, never as a second hue.
   A colour would read as a third category of health; a hollow dot reads as
   "nothing is happening here", which is the truth. */
.sfdot.off,.sfdot.idle,.sfdot.unknown{background:transparent;border:1px solid var(--border-strong)}
.sfname{font:400 12.5px var(--font);color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis}
.sfstate{font:700 10px var(--font);letter-spacing:.10em;color:var(--dim)}
.sfrow.bad .sfstate{color:var(--danger)}
.sfrow.ok .sfstate,.sfrow.busy .sfstate{color:var(--check)}
.sfdetail{font:400 12px var(--font);color:var(--type);min-width:0;overflow:hidden;text-overflow:ellipsis}
/* THE EXPLANATION RIDES EVERY ROW, not a tooltip. Nobody hovers on a stream,
   and an operator who has to ask what a process does has learned nothing from a
   coloured dot. */
.sfwhy{grid-column:2/-1;font:400 11px/1.5 var(--font);color:var(--dim)}
/* THE REASON IS THE PAYLOAD — the publisher's own words, verbatim. This is the
   line whose absence made the failed [+ baseline] click invisible, so it is
   never clipped, never truncated, and never behind an interaction. */
.sfreason{grid-column:2/-1;font:400 11.5px/1.55 var(--font);color:var(--fg);white-space:pre-wrap}
.sfreason.bad{color:var(--danger)}

/* The minimized dock carries the blocking count, because the dock is minimized
   by default and a failure only visible once expanded is one the operator has
   to go looking for. */
.tui-block{font:700 10px var(--font);letter-spacing:.10em;color:var(--danger);border:1px solid var(--danger);border-radius:var(--radius-sm);padding:2px 7px}
.tui-ready{font:700 10px var(--font);letter-spacing:.10em;color:var(--dim)}
.tui-confirm{width:min(376px,calc(100vw - 48px))}
.tui-confirm .body{line-height:1.65}
.btn.destroy.solid{background:var(--danger);color:var(--bg);border-color:var(--danger)}
.confirm-actions{flex-direction:column;align-items:stretch;gap:8px}
.confirm-actions .btn{text-align:center}

/* ── VIEWPORT STEP-DOWN for the new grids ────────────────────────────────
   Measured breakpoints. Nothing is ever hidden — the rail reflows and the
   live panel stacks rather than clipping a column. */
@media (max-width:1600px){
  .rail{grid-template-columns:repeat(3,minmax(0,1fr))}
}
/* `.live` used to need a stacking rule at each of these widths. It is a single
   column at every width now, so there is nothing left to stack. */
@media (max-width:1100px){
  .axes-row{grid-template-columns:minmax(0,1fr)}
  .rail{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* The policy drawer stacks rather than compressing. Nothing is hidden: the
     run table keeps its LOG column, which is how a cell is found on disk. */
}

/* ── LEARNING PANEL — the in-session capture surface ─────────────────────
   Three views over board.learning: MATRIX (gate × attempt), CLAIMS (the
   model's own account), LIVE (bookkeeping + history). Colours are SEMANTIC —
   pass/fail are gate outcomes only, polarity never takes them, arm identity is
   words + colour like the rest of the board. */
.dim{color:var(--dim);font-style:normal}
.learn{display:flex;flex-direction:column;gap:11px;min-width:0;font-family:var(--font);color:var(--fg)}
.learn-head{display:flex;align-items:baseline;gap:12px;min-width:0}
.learn-kick{font:700 10.5px var(--font);letter-spacing:.16em;color:var(--dim);flex:none}
.learn-note{font:400 11.5px/1.5 var(--font);color:var(--dim);min-width:0}
.learn-head .learn-note{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.learn-block{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--hairline)}
.learn-block.warn{border-top:1px solid var(--border-strong)}

/* THE MATRIX. Cells are full-column bars (11px), not squares — a dense grid a
   skeptic can diff against predicate-outcomes.jsonl line by line. */
.lm{display:flex;flex-direction:column;gap:2px;min-width:0}
.lm-row{display:grid;grid-template-columns:150px repeat(var(--cols,5),1fr);gap:2px;align-items:center;min-width:0}
.lm-label{font:400 10.5px var(--font);color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lm-phase .lm-label{font:700 9.5px var(--font);letter-spacing:.16em;color:var(--dim)}
.lm-phase{margin-top:4px;border-top:1px solid var(--hairline);padding-top:4px}
.lm-hdr .lm-label{font:700 10px var(--font);letter-spacing:.1em;color:var(--dim)}
.lm-ahwrap{text-align:center}
.lm-ah{font:700 10px var(--font);letter-spacing:.1em;display:inline-block}
.lm-ah i{display:block;font:italic 400 8.5px var(--font);letter-spacing:.06em;font-style:normal;opacity:.7}
.lm-scroll{max-height:392px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-right:4px}
.lm-cell{height:11px;border-radius:2px}
.lm-cell.pass{background:var(--check);border:1px solid var(--check)}
.lm-cell.fail{background:var(--danger);border:1px solid var(--danger)}
.lm-cell.none{background:transparent;border:1px dotted var(--dim)}
/* A flip marker: a bright left rule, so a state change reads even in greyscale. */
.lm-cell.flip{border-left:4px solid var(--type)}
.learn-legend{display:flex;flex-wrap:wrap;gap:16px;padding-top:9px;border-top:1px solid var(--hairline);font:400 11px var(--font);color:var(--dim)}
.lm-key{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:baseline;margin-right:5px}
.lm-key.pass{background:var(--check)}
.lm-key.fail{background:var(--danger)}
.lm-key.none{background:transparent;border:1px dotted var(--dim)}
.lm-key.flipk{width:4px;background:var(--type)}

/* ATTEMPT WINDOWS — labels come from learning-ledger.json, never computed. */
.learn-windows{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.lw{border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 7px;display:flex;flex-direction:column;gap:2px;background:transparent}
.lw.bad{border-color:var(--danger);background:var(--bg-2)}
.lw-num{font:700 10px var(--font);color:var(--type)}
.lw-label{font:400 10px/1.3 var(--font);color:var(--fg);overflow-wrap:anywhere}
.lw-label.dim{color:var(--dim)}

/* CLAIM DISTRIBUTION. fixed=0 is a measured result and renders as 0. */
.learn-dist{display:flex;flex-wrap:wrap;gap:7px}
.ld-chip{display:flex;align-items:baseline;gap:7px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;font:400 11.5px var(--font);color:var(--fg)}
.ld-chip.dim{color:var(--dim);border-style:dashed;border-color:var(--border-strong)}
.ld-label{color:var(--dim)}
.ld-n{font-weight:700;font-variant-numeric:tabular-nums;color:var(--type)}
.ld-n.zero{color:var(--dim)}

/* CLAIMS — the model's own account, two authors side by side. */
.lc-goal{display:flex;align-items:baseline;gap:10px;border:1px dashed var(--border-strong);border-radius:var(--radius-md);padding:9px 11px}
.lc-goal .learn-kick{flex:none}
.lc-goal-text{flex:1;min-width:0;font:400 11.5px/1.5 var(--font);color:var(--fg)}
.lc-invalid{display:flex;flex-direction:column;gap:4px;border:1px solid var(--danger);border-radius:var(--radius-md);padding:9px 11px}
.lc-traj{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg-2)}
.lc-traj-head{display:flex;align-items:baseline;gap:11px;padding:10px 12px;border-bottom:1px solid var(--hairline)}
.lc-traj-label{flex:none;font:700 12.5px var(--font);color:var(--type)}
.lc-count{flex:none;font:400 11px var(--font);color:var(--fg)}
.lc-rec{padding:11px 12px;border-bottom:1px solid var(--hairline);display:flex;flex-direction:column;gap:8px}
.lc-rec:last-child{border-bottom:0}
.lc-rec-top{display:flex;align-items:baseline;gap:10px}
/* Polarity is do-this / do-not-do, NOT a verdict — muted, never pass/fail. */
.lc-pol{flex:none;font:700 10px var(--font);letter-spacing:.12em;color:var(--comment);border:1px solid var(--comment);border-radius:var(--radius-sm);padding:3px 7px}
.lc-pol.neg{border-style:dashed}
.lc-statement{flex:1;min-width:0;font:400 13px/1.5 var(--font);color:var(--type);overflow-wrap:anywhere}
.lc-win{flex:none;font:700 10px var(--font);letter-spacing:.12em;color:var(--fg);border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:3px 7px}
.lc-win.bad{color:var(--danger);border-color:var(--danger)}
.lc-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lc-col{display:flex;flex-direction:column;gap:5px;min-width:0}
.lc-w{font:400 11.5px/1.55 var(--font);color:var(--fg)}
.lc-w i{font-style:normal;color:var(--dim)}
.lc-evs{display:flex;flex-direction:column;gap:3px;padding-top:3px}
.lc-ev{font:italic 400 11.5px/1.5 var(--font);color:var(--fg)}
.lc-ev i{font-style:normal;color:var(--dim)}
.lc-lines{display:flex;flex-wrap:wrap;gap:4px}
.lc-line{font:700 11px var(--font);color:var(--fg);background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:3px 7px;font-variant-numeric:tabular-nums}
.learn-foot2{display:flex;gap:20px;padding-top:9px;border-top:1px solid var(--hairline)}
.learn-foot2>span{flex:1;font:400 11px/1.5 var(--font);color:var(--dim)}

/* LIVE — bookkeeping, marks pips, capture states, session history. */
.lv-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.lv-col{display:flex;flex-direction:column;gap:11px;min-width:0}
.lbook{display:flex;flex-direction:column;gap:7px}
.lbook-row{display:flex;align-items:baseline;gap:10px;font:400 12px var(--font)}
.lbook-k{flex:none;width:132px;color:var(--dim)}
.lbook-v{flex:1;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.lp-pips{display:flex;gap:5px;align-items:center}
.lp-pip{width:30px;height:13px;border-radius:3px;background:transparent;border:1px dotted var(--dim)}
.lp-pip.on{background:var(--fg);border:1px solid var(--fg)}
.lp-pip.gap{background:transparent;border:1px solid var(--border-strong)}
.lcs-list{display:flex;flex-direction:column;gap:6px}
.lcs{display:flex;align-items:baseline;gap:9px;border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:7px 9px;background:transparent}
.lcs.on{background:var(--bg-2);border-style:solid}
.lcs-label{flex:none;font:700 10px var(--font);letter-spacing:.12em;width:112px}
.lcs-body{flex:1;min-width:0;font:400 11px/1.45 var(--font);color:var(--fg);overflow-wrap:anywhere}
.ls{display:flex;flex-direction:column;min-width:0}
.ls-row{display:grid;grid-template-columns:112px 62px minmax(0,1fr) 74px 74px;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--hairline);font:400 11.5px var(--font);color:var(--fg);font-variant-numeric:tabular-nums}
.ls-hdr{font:700 9.5px var(--font);letter-spacing:.12em;color:var(--dim);padding-bottom:5px}
.ls-id{color:var(--type);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls-tally{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls-bytes{color:var(--dim)}

/* The unobserved / unwired frame — a designed state, never an error. */
.learn-frame{border:1px dashed var(--border-strong);border-radius:var(--radius-lg);padding:20px;display:flex;flex-direction:column;gap:7px}
.learn-frame-head{font:700 11px var(--font);letter-spacing:.16em;color:var(--dim)}
.learn-frame-body{font:400 12.5px/1.6 var(--font);color:var(--fg);max-width:820px}
.learn-frame-note{font:400 11.5px/1.5 var(--font);color:var(--dim)}

/* ── LEARNING AND THE TUI MIRROR LIVE ON THE TRANSFER CURVE CARD ──────────
   The curve header carries the top-level TRANSFER CURVE | LEARNING | TUI
   MIRROR switch; the learning tab's own bar carries MATRIX / CLAIMS / LIVE.
   The curve is the WHAT, the learning view is the WHY, the mirror is the RAW —
   one card, one header.

   THE ARM A/B LEGEND USED TO SIT HERE and is deleted with its rules
   (`.arm-legend`, `.arm-swatch`). Three tabs leave no room for it, and the arms
   are already named in words on the learning cell-info row and on the plot's
   own labels — the legend was the third place saying the same thing. The
   `--arm-a` / `--arm-b` PROPERTIES stay — recall.js and learning.js colour by
   them directly — but the `.arm-a` / `.arm-b` CLASSES went with the legend:
   it was their only caller. */
.curve-metric{display:flex;justify-content:flex-end}
.curve-foot .btn{margin-left:auto}

.learn-bar{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--hairline);min-width:0}
.learn-brand{flex:none;font:700 11px var(--font);letter-spacing:.18em;color:var(--type)}
.learn-cellinfo{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--hairline);font:400 12px var(--font)}
.learn-cell{color:var(--type)}
.learn-arm{font-weight:700}
.learn-model{color:var(--dim)}
.learn-state{flex:none;font:700 10.5px var(--font);letter-spacing:.14em;color:var(--type);border:1px solid var(--fg);border-radius:var(--radius-sm);padding:3px 8px;white-space:nowrap}
.learn-state.good{color:var(--check);border-color:var(--check)}
.learn-state.muted{color:var(--dim);border-color:var(--border-strong)}
.learn-state.bad{color:var(--danger);border-color:var(--danger)}

/* The learning views live inside the 50% curve card, so the two-column LIVE
   view stacks where the card is narrow. */
@media (max-width:1400px){.lv-cols{grid-template-columns:minmax(0,1fr)}}

/* ── DEV MODE (panels/devmode.js) ─────────────────────────────────────────
   The settings drawer's mode toggle, and the topbar markers chrome.js will
   emit (`.devmode-on` / `.devmode-unknown` are a FIXED CONTRACT — those exact
   names, pre-styled here).

   UNREACHABLE IS NOT OFF. The unknown subtree is dashed — the board's
   no-signal grammar (`.learn-frame`) — and amber, never the
   hollow-dim off treatment: absence of an answer must not render as a
   confident OFF.

   ON IS AMBER, NOT --danger. The off-hue is reserved for gate failure,
   regression and a LAN-exposed hold; dev mode on is an
   operator caution — the board offers non-scorable cells — so it wears the
   same amber as `.fx-blocked`. State on the row follows the feed's
   data-attribute convention (`.evrow[data-level]`): a left rule only, and
   OFF is a hairline — absence drawn as absence. */

/* A refusal from the server wears the off-hue, like every refusal on the
   board (`.rm-refusal`, `.rwhy.bad`). */

.devmode-on{
  display:inline-flex;align-items:center;gap:6px;
  font:700 10.5px var(--font);letter-spacing:.16em;
  color:var(--bg);background:var(--warn,#e0b34d);
  border:1px solid var(--warn,#e0b34d);border-radius:var(--radius-pill);
  padding:3px 10px;white-space:nowrap;
}
.devmode-unknown{
  display:inline-flex;align-items:center;gap:6px;
  font:700 10.5px var(--font);letter-spacing:.16em;
  color:var(--dim);background:transparent;
  border:1px dashed var(--border-strong);border-radius:var(--radius-pill);
  padding:3px 10px;white-space:nowrap;
}
