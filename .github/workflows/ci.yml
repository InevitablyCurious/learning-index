name: CI

on:
  push:
  pull_request:

# The job only reads the repo. A read-only token, and none left in .git/config,
# leaves nothing worth stealing to a compromised dependency installed below.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      # Node 22.6+ runs images/worker/self-compact.test.ts directly
      # (--experimental-strip-types), via tests/test_self_compact_plugin.py.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: '0.10.12'
      # Installs exactly what uv.lock pins, hashes checked; a newly published
      # release (a backdoored one included) cannot reach CI until the lock moves.
      - run: uv sync --locked --extra test --python 3.12
      - run: .venv/bin/ruff format --check .
      - run: PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -m "not slow" -p no:cacheprovider --tb=short -q
